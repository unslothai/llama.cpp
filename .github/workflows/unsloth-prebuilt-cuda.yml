name: "Unsloth prebuilt: CUDA"

# Reusable child of unsloth-prebuilt.yml. Builds the per-profile CUDA bundles
# the parent's `resolve` job filtered into `matrix`. Each entry uploads a
# single app-*.tar.gz artifact for the parent's assemble step to pick up.
#
# N slices per profile (`shards`): `build` compiles slice 0, `warm` jobs slices 1..N-1 and save a
# ccache delta. All start right after `resolve` (one janitor pass covers the run); `build` waits for
# its warm jobs, merges the deltas and runs the full build. A late or dead shard only costs time.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Upstream llama.cpp release tag (b####), resolved by parent'
        required: true
        type: string
      commit:
        description: 'Upstream commit SHA for that tag, resolved by parent'
        required: true
        type: string
      repo:
        description: 'Source repo (owner/name): ggml-org/llama.cpp for plain builds, or this repo for mix tags'
        required: false
        default: 'ggml-org/llama.cpp'
        type: string
      source_artifact:
        description: 'Workflow artifact (app-source-*) holding the stamped source tree; set by resolve for every build'
        required: false
        default: ''
        type: string
      matrix:
        description: 'Matrix JSON {include:[...]} produced by the parent resolve job; each row carries `shards`'
        required: true
        type: string
      warm_matrix:
        description: 'Matrix JSON {include:[...]} of (profile row x shard) for the warm job, or empty to skip warming'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  warm:
    # linux- prefix: build finds its shards by name, and the Windows child has x64 rows too.
    name: warm linux-${{ matrix.arch }}/${{ matrix.profile }} ${{ matrix.shard }}/${{ matrix.shards }}
    # An empty string, not an empty include list: with the `if` false the strategy is never
    # evaluated, while fromJSON('{"include":[]}') fails the job instead of skipping it.
    if: ${{ inputs.warm_matrix != '' }}
    runs-on: ${{ matrix.runner }}
    # Best effort (see header); the parent's waiter excludes ` / warm ` jobs.
    continue-on-error: true
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.warm_matrix) }}
    steps:
      # Only when short: today's images start with far more free space than a leg uses (df is logged).
      - name: Check free disk space
        id: disk
        run: |
          avail="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          echo "free on /: ${avail} GB"
          if [ "${avail:-0}" -lt 50 ]; then echo "low=true" >> "$GITHUB_OUTPUT"; fi

      - name: Free disk space
        if: ${{ steps.disk.outputs.low == 'true' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Checkout build tooling (this repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling

      - name: Source, toolkit, ccache, configure
        uses: ./tooling/.github/actions/unsloth-cuda-linux-setup
        with:
          tag: ${{ inputs.tag }}
          source_artifact: ${{ inputs.source_artifact }}
          cuda: ${{ matrix.cuda }}
          arch: ${{ matrix.arch }}
          archs: ${{ matrix.archs }}
          profile: ${{ matrix.profile }}
          max-size: ${{ matrix.klass == 'portable' && '4G' || '3G' }}

      # Path + size, manifests by hash; not mtimes (ccache touches every hit).
      # Before the earlier deltas merge, so hits served from them are exported too: the leg restores
      # only this run's deltas and lacks them after a night whose leg did not save.
      - name: Snapshot the restored cache
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/.ccache"
          find . -type f -printf '%p\t%s\n' | sort > "${{ github.workspace }}/shard.before"
          find . -type f -name '*M' -print0 | xargs -0 -r sha256sum | sort > "${{ github.workspace }}/shard.before.m"

      # Previous deltas are restored too (tagless fallback), so a retry compiles only what changed since them.
      - name: Restore warm shard 0
        if: ${{ matrix.shards >= 1 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/0
          key: ccache-shard0-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
          restore-keys: |
            ccache-shard0-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
            ccache-shard0-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-
      - name: Restore warm shard 1
        if: ${{ matrix.shards >= 2 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/1
          key: ccache-shard1-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
          restore-keys: |
            ccache-shard1-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
            ccache-shard1-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-
      - name: Restore warm shard 2
        if: ${{ matrix.shards >= 3 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/2
          key: ccache-shard2-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
          restore-keys: |
            ccache-shard2-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
            ccache-shard2-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-
      - name: Restore warm shard 3
        if: ${{ matrix.shards >= 4 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/3
          key: ccache-shard3-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
          restore-keys: |
            ccache-shard3-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
            ccache-shard3-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-

      - name: Merge warm shards into the ccache
        if: ${{ matrix.shards >= 1 }}
        run: |
          set -euo pipefail
          for d in shards/*/; do
            [ -d "$d" ] || continue
            echo "merging $d ($(find "$d" -type f | wc -l) files, $(du -sh "$d" | cut -f1))"
            cp -au "$d." "${{ github.workspace }}/.ccache/"
          done
          rm -rf shards
          ccache -z

      - name: Compile shard ${{ matrix.shard }} of ${{ matrix.shards }}
        working-directory: src
        run: |
          set -euo pipefail
          bash ../tooling/scripts/unsloth/slice_objects.sh build "${{ matrix.shard }}" "${{ matrix.shards }}" ../.ccache/slice-costs.tsv > shard.txt
          echo "$(wc -l < shard.txt) objects in this shard ($(grep -c 'ggml-cuda' shard.txt || true) CUDA)"
          xargs -a shard.txt -d '\n' ninja -C build -j 3

      - name: ccache stats
        if: ${{ always() }}
        run: |
          ccache -s -v
          df -h /

      - name: Record this slice's compile times
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf .ccache/slice-costs.d && mkdir -p .ccache/slice-costs.d
          bash tooling/scripts/unsloth/slice_costs.sh export src/build ".ccache/slice-costs.d/shard${{ matrix.shard }}.tsv"

      # Only what this job added or rewrote, tree layout preserved: never a 4 GB copy of the generation.
      - name: Export the shard delta
        if: ${{ always() }}
        run: |
          set -euo pipefail
          W="${{ github.workspace }}"
          mkdir -p "$W/shards/${{ matrix.shard }}"
          cd "$W/.ccache"
          find . -type f -printf '%p\t%s\n' | sort > "$W/shard.after"
          find . -type f -name '*M' -print0 | xargs -0 -r sha256sum | sort > "$W/shard.after.m"
          { comm -13 "$W/shard.before" "$W/shard.after" | cut -f1
            comm -13 "$W/shard.before.m" "$W/shard.after.m" | awk '{ print $2 }'; } | sort -u > "$W/shard.changed"
          xargs -a "$W/shard.changed" -d '\n' -r cp --parents -a -t "$W/shards/${{ matrix.shard }}/"
          echo "$(find "$W/shards/${{ matrix.shard }}" -type f | wc -l) files, $(du -sh "$W/shards/${{ matrix.shard }}" | cut -f1)"

      - name: Save shard ccache
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/${{ matrix.shard }}
          # Shard index ahead of the profile so the generation prefix restore never picks a shard.
          key: ccache-shard${{ matrix.shard }}-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}

  build:
    name: ${{ matrix.arch }}/${{ matrix.profile }}
    # No `needs: warm`: queued with the run, compiles slice 0 while the warm jobs run.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check free disk space
        id: disk
        run: |
          avail="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          echo "free on /: ${avail} GB"
          if [ "${avail:-0}" -lt 50 ]; then echo "low=true" >> "$GITHUB_OUTPUT"; fi

      - name: Free disk space
        if: ${{ steps.disk.outputs.low == 'true' }}
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Checkout build tooling (this repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling

      - name: Source, toolkit, ccache, configure
        uses: ./tooling/.github/actions/unsloth-cuda-linux-setup
        with:
          tag: ${{ inputs.tag }}
          source_artifact: ${{ inputs.source_artifact }}
          cuda: ${{ matrix.cuda }}
          arch: ${{ matrix.arch }}
          archs: ${{ matrix.archs }}
          profile: ${{ matrix.profile }}
          max-size: ${{ matrix.klass == 'portable' && '4G' || '3G' }}

      - name: Compile slice 0 of ${{ matrix.shards }}
        if: ${{ matrix.shards >= 2 }}
        working-directory: src
        run: |
          set -euo pipefail
          bash ../tooling/scripts/unsloth/slice_objects.sh build 0 "${{ matrix.shards }}" ../.ccache/slice-costs.tsv > shard.txt
          echo "$(wc -l < shard.txt) objects in slice 0 ($(grep -c 'ggml-cuda' shard.txt || true) CUDA)"
          xargs -a shard.txt -d '\n' ninja -C build -j 3

      # A late or failed shard only means this job compiles its slice in the full build below.
      - name: Wait for the warm shards
        if: ${{ matrix.shards >= 2 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tooling/scripts/unsloth/wait_for_jobs.sh \
            --match " / warm linux-${{ matrix.arch }}/${{ matrix.profile }} " \
            --expect $(( ${{ matrix.shards }} - 1 )) --deadline-min 160 --poll 60 || true

      - name: Restore warm shard 1
        if: ${{ matrix.shards >= 2 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/1
          key: ccache-shard1-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
          restore-keys: |
            ccache-shard1-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
            ccache-shard1-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-
      - name: Restore warm shard 2
        if: ${{ matrix.shards >= 3 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/2
          key: ccache-shard2-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
          restore-keys: |
            ccache-shard2-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
            ccache-shard2-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-
      - name: Restore warm shard 3
        if: ${{ matrix.shards >= 4 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: shards/3
          key: ccache-shard3-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
          restore-keys: |
            ccache-shard3-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-
            ccache-shard3-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-

      - name: Merge warm shards into the ccache
        if: ${{ matrix.shards >= 2 }}
        run: |
          set -euo pipefail
          for d in shards/*/; do
            [ -d "$d" ] || continue
            echo "merging $d ($(find "$d" -type f | wc -l) files, $(du -sh "$d" | cut -f1))"
            cp -au "$d." "${{ github.workspace }}/.ccache/"
          done
          rm -rf shards
          ccache -z

      - name: Build
        working-directory: src
        run: |
          set -eux
          # Backend modules (CPU variants, CUDA, RPC) build as ggml dependencies,
          # so every tool pulls them in.
          # -j 3: this multi-arch nvcc build peaks at ~3 GB host RSS on the
          # 4 vCPU / 16 GB GitHub-hosted runners (x64 and arm64 alike, measured
          # over a 1s sampler), so 3 parallel TUs leave ~13 GB free. -j 4 adds
          # no speed (the runner is ~2 physical cores + HT), so 3 is the sweet spot;
          # -j 2 with nvcc --threads 2 measured within 5%, not worth the flag.
          cmake --build build --config Release -j 3
          strip build/bin/llama-* || true

      - name: Record slice costs
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          bash tooling/scripts/unsloth/slice_costs.sh export src/build "$RUNNER_TEMP/slice-costs-leg.tsv"
          bash tooling/scripts/unsloth/slice_costs.sh merge .ccache/slice-costs.tsv \
            "$RUNNER_TEMP/slice-costs-leg.tsv" .ccache/slice-costs.d/*.tsv
          rm -rf .ccache/slice-costs.d

      # The DiffusionGemma visual server + cli are example targets that exist
      # only when the source tree carries ggml-org/llama.cpp#24423 (a mix build).
      # Build them best-effort and NEVER fail the job: the full tool bundle
      # above must publish even if these do not compile on a given toolchain.
      # package_bundle.py ships them only if they were produced.
      - name: Build DiffusionGemma binaries (best-effort; mix builds only)
        working-directory: src
        run: |
          set -u
          if [ ! -d examples/diffusion-gemma-server ]; then
            echo "no DiffusionGemma sources in this tree; skipping"
            exit 0
          fi
          cmake -S . -B build -DLLAMA_BUILD_EXAMPLES=ON \
            || { echo "reconfigure for examples failed; skipping DiffusionGemma binaries"; exit 0; }
          if cmake --build build --config Release -j 3 \
              --target llama-diffusion-gemma-visual-server llama-diffusion-cli; then
            strip build/bin/llama-diffusion-gemma-visual-server build/bin/llama-diffusion-cli || true
            echo "built DiffusionGemma binaries"
          else
            echo "warning: DiffusionGemma binaries failed to build; bundle will omit them"
          fi
          exit 0

      # Misses on every CUDA TU with C++ hitting is a base bump that touched a shared CUDA header.
      - name: ccache stats
        if: ${{ always() }}
        run: |
          ccache -s -v
          df -h /
          {
            echo "### ccache ${{ matrix.arch }}/${{ matrix.profile }}"
            echo ""
            echo '```'
            ccache -s
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package bundle
        env:
          PLATFORM: linux
          ARCH: ${{ matrix.arch }}
          BIN_DIR: ${{ github.workspace }}/src/build/bin
          SRC_DIR: ${{ github.workspace }}/src
          OUT_DIR: ${{ github.workspace }}/dist
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.commit }}
          SOURCE_REPO: ${{ inputs.repo }}
          SOURCE_REF_KIND: ${{ inputs.repo == 'ggml-org/llama.cpp' && 'tag' || 'mix' }}
          PROFILE: ${{ matrix.profile }}
          LINE: ${{ matrix.line }}
          KLASS: ${{ matrix.klass }}
          RANK: ${{ matrix.rank }}
          TOOLKIT_LINE: ${{ matrix.toolkit_line }}
          # Provenance label kept byte for byte as under the Jimver install: bundles must stay
          # identical, metadata included, and the compiler behind the label is the same nvcc.
          DOCKER_IMAGE: github-hosted ${{ matrix.runner }}, CUDA ${{ matrix.cuda }} ${{ matrix.cuda == '13.3' && '(NVIDIA redist)' || '(Jimver)' }}
          ARCHS: ${{ matrix.archs }}
          SMS: ${{ matrix.sms }}
        run: python3 tooling/scripts/unsloth/package_bundle.py

      - name: Upload bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: app-${{ inputs.tag }}-linux-${{ matrix.arch }}-${{ matrix.profile }}
          path: dist/app-${{ inputs.tag }}-linux-${{ matrix.arch }}-${{ matrix.profile }}.tar.gz
          if-no-files-found: error

      - name: Evict stale ccache files
        # !cancelled(), unlike the save below: on a timeout the job gets a
        # single ~5 minute teardown window (measured ~4m50s after process
        # kill), shared by every remaining step and not replenished. Evicting
        # spends that window on housekeeping; the save is what actually needs
        # it, and a multi-GB cache is not quick to write. 7 days: with a daily base bump an
        # object idle for a week is dead, and the smaller dir keeps restore and save near a minute.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache --evict-older-than 7d

      - name: Save ccache
        # Save even when the build failed: the objects compiled before the
        # failure are still worth keeping, and a job that saves nothing leaves
        # a hole in the cache lineage that widens the next run's tag gap.
        # Measured: gap 7 -> 68% hit rate, gap 13 -> 6%.
        #
        # always(), not !cancelled(): a timeout-minutes expiry puts the job on
        # the CANCELLATION path, not the failure path, so !cancelled() would
        # skip the save on the single most expensive case -- a leg that
        # compiled for hours and then hit the cap.
        #
        # Run id and attempt on the key: entries are immutable, so a same-tag retry could
        # otherwise never replace a partial save. The restore prefix ignores the suffix.
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-cuda-${{ matrix.cuda }}-${{ matrix.arch }}-${{ matrix.profile }}-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
