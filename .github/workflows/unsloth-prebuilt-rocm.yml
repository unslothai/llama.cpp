name: "Unsloth prebuilt: ROCm"

# Reusable child of unsloth-prebuilt.yml. Per-gfx-target ROCm bundles on
# Windows + Ubuntu.
#
# Huge thanks to the lemonade-sdk team -- this is adapted from their workflow:
#   https://github.com/lemonade-sdk/llamacpp-rocm/blob/main/.github/workflows/build-llamacpp-rocm.yml
#
# Build mechanics taken from that file: TheRock multi-arch nightly download +
# version auto-detect, gfx target name mapping, HIP/clang cmake invocation, the
# full hardcoded ROCm runtime lib copy list, patchelf RPATH.
#
# Local adaptations:
#   - tag is passed in (the parent resolves it against ggml-org upstream)
#     instead of lemonade's auto-incrementing b1000+ scheme.
#   - artifacts pre-packaged into app-<tag>-<platform>-x64-rocm-<gfx>.{tar.gz|zip}
#     so the parent assemble step picks them up via the same merge-multiple
#     download pattern it uses for CUDA bundles.
#   - test jobs (stx-halo, stx) dropped -- those need self-hosted AMD runners.
#   - build-summary + post-build cleanup steps dropped (clutter).

on:
  workflow_call:
    inputs:
      tag:
        description: 'Upstream llama.cpp release tag (b####), resolved by parent'
        required: true
        type: string
      repo:
        description: 'Source repo (owner/name): ggml-org/llama.cpp for plain builds, or this repo for mix tags'
        required: false
        default: 'ggml-org/llama.cpp'
        type: string
      source_artifact:
        description: 'Workflow artifact (app-source-*) holding the stamped source tree; set by resolve for every build'
        required: false
        default: ''
        type: string
      matrix:
        description: 'gfx_target matrix JSON ({"gfx_target":[...]}), built by parent'
        required: true
        type: string
      operating_systems:
        description: 'OSes to build for (comma-separated: windows,ubuntu)'
        required: false
        default: 'windows,ubuntu'
        type: string
      rocm_version:
        description: 'TheRock ROCm version (e.g., 10.1.0a20260807), "weekly" or "latest"'
        required: false
        default: 'weekly'
        type: string
      rocm_cutoff:
        description: 'For "weekly": YYYYMMDD cutoff resolved once by the parent. Blank means each leg computes its own.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: windows/${{ matrix.gfx_target }}
    runs-on: windows-latest
    if: contains(inputs.operating_systems, 'windows')
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
      fail-fast: false

    steps:
    - name: Clean up existing directories (safety precaution)
      run: |
        # Remove existing llama.cpp directory if it exists
        if (Test-Path "llama.cpp") {
          Write-Host "Removing existing llama.cpp directory..."
          Remove-Item -Recurse -Force "llama.cpp"
        }

        # Remove existing C:\opt\rocm directory if it exists
        if (Test-Path "C:\opt\rocm") {
          Write-Host "Removing existing C:\opt\rocm directory..."
          Remove-Item -Recurse -Force "C:\opt\rocm"
        }

        # Remove any existing ROCm tarball
        if (Test-Path "rocm.tar.gz") {
          Write-Host "Removing existing rocm.tar.gz..."
          Remove-Item -Force "rocm.tar.gz"
        }

        Write-Host "Cleanup completed successfully"

    - name: Install Visual Studio Build Tools
      run: |
        # Retry helper: Invoke-WebRequest's -MaximumRetryCount only retries on
        # HTTP status failures (400-599/304), not on the TCP-level connection
        # timeouts these download hosts intermittently throw, so wrap each
        # download in an explicit catch-all retry with linear backoff.
        function Invoke-DownloadWithRetry {
          param([string]$Uri, [string]$OutFile, [int]$Retries = 5, [int]$DelaySec = 10)
          for ($i = 1; $i -le $Retries; $i++) {
            try {
              Invoke-WebRequest -Uri $Uri -OutFile $OutFile -ErrorAction Stop
              return
            } catch {
              Write-Host "Download attempt $i/$Retries for $Uri failed: $($_.Exception.Message)"
              if ($i -eq $Retries) { throw }
              Start-Sleep -Seconds ($DelaySec * $i)
            }
          }
        }

        # Download and install Visual Studio Build Tools
        $vsInstallerUrl = "https://aka.ms/vs/17/release/vs_buildtools.exe"
        $vsInstallerPath = "$env:TEMP\vs_buildtools.exe"

        Write-Host "Downloading Visual Studio Build Tools..."
        Invoke-DownloadWithRetry -Uri $vsInstallerUrl -OutFile $vsInstallerPath

        Write-Host "Installing Visual Studio Build Tools..."
        Start-Process -FilePath $vsInstallerPath -ArgumentList "--quiet", "--wait", "--norestart", "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "--add", "Microsoft.VisualStudio.Component.VC.CMake.Project", "--add", "Microsoft.VisualStudio.Component.VC.ATL", "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621" -Wait

        # Clean up installer
        Remove-Item $vsInstallerPath -Force

    - name: Install build dependencies
      run: |
        Write-Host "Installing build dependencies using manual methods..."

        # Retry helper: Invoke-WebRequest's -MaximumRetryCount only retries on
        # HTTP status failures (400-599/304), not on the TCP-level connection
        # timeouts these download hosts intermittently throw, so wrap each
        # download in an explicit catch-all retry with linear backoff.
        function Invoke-DownloadWithRetry {
          param([string]$Uri, [string]$OutFile, [int]$Retries = 5, [int]$DelaySec = 10)
          for ($i = 1; $i -le $Retries; $i++) {
            try {
              Invoke-WebRequest -Uri $Uri -OutFile $OutFile -ErrorAction Stop
              return
            } catch {
              Write-Host "Download attempt $i/$Retries for $Uri failed: $($_.Exception.Message)"
              if ($i -eq $Retries) { throw }
              Start-Sleep -Seconds ($DelaySec * $i)
            }
          }
        }

        # Install Ninja
        Write-Host "Installing Ninja..."
        $ninjaUrl = "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip"
        $ninjaPath = "$env:TEMP\ninja-win.zip"
        $ninjaDir = "C:\ninja"
        New-Item -ItemType Directory -Force -Path $ninjaDir
        Invoke-DownloadWithRetry -Uri $ninjaUrl -OutFile $ninjaPath
        Expand-Archive -Path $ninjaPath -DestinationPath $ninjaDir -Force

        # Install Strawberry Perl via Chocolatey (already on the runner) instead
        # of downloading the MSI from the frequently-unreachable strawberryperl.com
        # host that was timing out and failing these builds. It ships preinstalled
        # on the windows-latest image, so this is normally a fast no-op.
        Write-Host "Installing Strawberry Perl via Chocolatey..."
        choco install strawberryperl -y --no-progress

        # Verify installations
        $env:PATH = "C:\ninja;C:\Strawberry\perl\bin;C:\Strawberry\c\bin;$env:PATH"
        Write-Host "Verifying installations..."
        ninja --version
        perl --version

        Write-Host "Manual installation of build dependencies completed"

    - name: Download ROCm nightly tarball
      run: |
        # Retry helper: Invoke-WebRequest's -MaximumRetryCount only retries on
        # HTTP status failures (400-599/304), not on the TCP-level connection
        # timeouts these download hosts intermittently throw, so wrap each
        # download in an explicit catch-all retry with linear backoff.
        function Invoke-DownloadWithRetry {
          param([string]$Uri, [string]$OutFile, [int]$Retries = 5, [int]$DelaySec = 10)
          for ($i = 1; $i -le $Retries; $i++) {
            try {
              Invoke-WebRequest -Uri $Uri -OutFile $OutFile -ErrorAction Stop
              return
            } catch {
              Write-Host "Download attempt $i/$Retries for $Uri failed: $($_.Exception.Message)"
              if ($i -eq $Retries) { throw }
              Start-Sleep -Seconds ($DelaySec * $i)
            }
          }
        }

        # Determine ROCm version to use
        $rocmVersion = "${{ inputs.rocm_version }}"
        $currentTarget = "${{ matrix.gfx_target }}"

        # Map the build target to the matching TheRock archive family
        $archiveTarget = $currentTarget
        if ($currentTarget -eq "gfx103X" -or $currentTarget -eq "gfx110X" -or $currentTarget -eq "gfx120X") {
          $archiveTarget = "$currentTarget-all"
          Write-Host "Using target with -all suffix: $archiveTarget"
        }

        # TheRock publishes nightlies to the multi-arch tarball index. The
        # static HTML page embeds a JSON `files` array with names and mtimes.
        $baseUrl = "https://rocm.nightlies.amd.com/tarball-multi-arch"
        if ($rocmVersion -eq "latest" -or $rocmVersion -eq "weekly") {
          # weekly: see the Linux job.
          $cutoff = "99999999"
          if ($rocmVersion -eq "weekly") {
            $cutoff = "${{ inputs.rocm_cutoff }}"
            if (-not $cutoff) {
              # Windows uses its own zone ids; the IANA name is the fallback.
              try   { $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("Pacific Standard Time") }
              catch { $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById("America/Los_Angeles") }
              $sf = [System.TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $tz)
              $cutoff = $sf.Date.AddDays(-([int]$sf.DayOfWeek + 1)).ToString("yyyyMMdd")
            }
            Write-Host "Weekly pin: newest build dated on or before $cutoff (week of the last SF Sunday)"
          } else {
            Write-Host "Auto-detecting latest ROCm version for target: $currentTarget"
          }
          $indexHtml = (Invoke-WebRequest "$baseUrl/" -UseBasicParsing).Content
          $filesMatch = [regex]::Match($indexHtml, 'const files = (\[.*?\]);', [System.Text.RegularExpressions.RegexOptions]::Singleline)
          if (-not $filesMatch.Success) {
            Write-Error "Failed to parse file index from $baseUrl/"
            exit 1
          }

          # Pick the newest build date and exclude sibling test archives.
          $allFiles = $filesMatch.Groups[1].Value | ConvertFrom-Json
          $prefix = "therock-dist-windows-$archiveTarget-"
          $versionPattern = "^$([regex]::Escape($prefix))\d+\.\d+\.\d+(a|rc)\d+\.tar\.gz$"
          $latest = $allFiles |
            Where-Object { $_.name -match $versionPattern } |
            Where-Object { [regex]::Match($_.name, '(\d{8})\.tar\.gz$').Groups[1].Value -le $cutoff } |
            Sort-Object { [regex]::Match($_.name, '(\d{8})\.tar\.gz$').Groups[1].Value } |
            Select-Object -Last 1
          if (-not $latest) {
            Write-Error "No tarball found for prefix '$prefix' at or before $cutoff at $baseUrl/"
            exit 1
          }
          $latestFile = $latest.name
          Write-Host "Found latest file: $latestFile"

          # Extract version from the filename for environment variable
          if ($latestFile -match "therock-dist-windows-$archiveTarget-(\d+\.\d+\.\d+(?:a|rc)\d+)\.tar\.gz") {
            $rocmVersion = $matches[1]
            Write-Host "Detected latest ROCm version: $rocmVersion"
          } else {
            Write-Error "Failed to extract ROCm version from latest file: $latestFile"
            Write-Error "Expected pattern: therock-dist-windows-$archiveTarget-<version>.tar.gz"
            exit 1
          }

          $rocmUrl = "$baseUrl/$latestFile"
        } else {
          $rocmUrl = "$baseUrl/therock-dist-windows-$archiveTarget-$rocmVersion.tar.gz"
        }

        # Store the version for use in other steps
        echo "DETECTED_ROCM_VERSION=$rocmVersion" >> $env:GITHUB_ENV

        Write-Host "Downloading ROCm from: $rocmUrl"
        Invoke-DownloadWithRetry -Uri $rocmUrl -OutFile "rocm.tar.gz"

    - name: Extract ROCm to C:\opt\rocm
      run: |
        # Create directory if it doesn't exist
        New-Item -ItemType Directory -Force -Path "C:\opt\rocm"

        # Extract the tarball
        tar -xzf rocm.tar.gz -C C:\opt\rocm --strip-components=1

    # Keyed per gfx target and OS: the seven targets compile different device
    # code from the same host sources, so a shared cache would mostly miss.
    # save: false -- the explicit actions/cache/save step at the end of the job
    # runs after packaging, so a failed package step does not persist a cache
    # for a bundle that never shipped (same pattern as the CPU/CUDA children).
    #
    # The ROCm version is in the key, and in the restore prefix, because ccache hashes the compiler into every entry: a cache from another nightly can never hit.
    - name: ccache
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
      with:
        key: rocm-windows-${{ matrix.gfx_target }}-${{ env.DETECTED_ROCM_VERSION }}-${{ inputs.tag }}
        restore-keys: |
          rocm-windows-${{ matrix.gfx_target }}-${{ env.DETECTED_ROCM_VERSION }}
        append-timestamp: false
        variant: ccache
        max-size: 2G
        save: false

    # The parent's resolve job built the source tree (upstream base + any mix
    # PRs, with the build number/commit and Unsloth fingerprint baked
    # into cmake/build-info.cmake) and uploaded it as an artifact; extract it
    # instead of cloning -- no .git needed, the build number is already baked.
    - name: Download source @ ${{ inputs.tag }}
      uses: actions/download-artifact@v6
      with:
        name: ${{ inputs.source_artifact }}
        path: srcpkg
    - name: Extract source
      shell: bash
      run: |
        set -eux
        mkdir -p llama.cpp
        tar -xzf "srcpkg/llama.cpp-source-${{ inputs.tag }}.tar.gz" -C llama.cpp --strip-components=1

    - name: Build Llama.cpp + ROCm
      shell: cmd
      run: |

        REM Map GPU targets
        set "current_target=${{ matrix.gfx_target }}"
        echo Input target: %current_target%

        if "%current_target%"=="gfx110X" (
          set "mapped_target=gfx1100;gfx1101;gfx1102;gfx1103"
        ) else if "%current_target%"=="gfx103X" (
          set "mapped_target=gfx1030;gfx1031;gfx1032;gfx1034"
        ) else if "%current_target%"=="gfx1151" (
          set "mapped_target=gfx1151"
        ) else if "%current_target%"=="gfx1150" (
          set "mapped_target=gfx1150"
        ) else if "%current_target%"=="gfx120X" (
          set "mapped_target=gfx1200;gfx1201"
        ) else (
          set "mapped_target=%current_target%"
        )
        echo Mapped target: %mapped_target%

        REM Set up environment variables and PATH
        set HIP_PATH=C:\opt\rocm
        set HIP_PLATFORM=amd
        set PATH=%HIP_PATH%\lib\llvm\bin;%HIP_PATH%\bin;%PATH%

        REM Set up x64 Native Tools Command Prompt environment.
        REM Pin to the VS 2022 line (-version "[17.0,18.0)") so vswhere -latest does not
        REM pick up the runner image's VS 2026 (MSVC 14.51), whose STL adds constexpr to
        REM math builtins like isgreater; that constexpr (implicitly __host__ __device__)
        REM collides with clang's HIP __device__ forward declares and breaks the ggml-cuda
        REM .cu compile (ggml-org/llama.cpp#22570). VS 2022 (MSVC 14.44) is unaffected.
        call "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vs_path.txt
        set /p VS_PATH=<vs_path.txt
        call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

        REM Create build directory
        cd llama.cpp
        mkdir build
        cd build

        REM Configure the project
        REM Only the C/CXX launchers here: ggml-hip forces CXX_IS_HIPCC on
        REM WIN32, so the device sources compile as C++, not the HIP language.
        cmake .. -G Ninja ^
          -DCMAKE_C_COMPILER="C:\opt\rocm\lib\llvm\bin\clang.exe" ^
          -DCMAKE_CXX_COMPILER="C:\opt\rocm\lib\llvm\bin\clang++.exe" ^
          -DCMAKE_CXX_FLAGS="-IC:\opt\rocm\include" ^
          -DCMAKE_CROSSCOMPILING=ON ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DGPU_TARGETS="%mapped_target%" ^
          -DBUILD_SHARED_LIBS=ON ^
          -DLLAMA_BUILD_TESTS=OFF ^
          -DGGML_HIP=ON ^
          -DGGML_OPENMP=OFF ^
          -DGGML_CUDA_FORCE_CUBLAS=OFF ^
          -DGGML_RPC=ON ^
          -DGGML_HIP_ROCWMMA_FATTN=OFF ^
          -DLLAMA_BUILD_BORINGSSL=ON ^
          -DGGML_NATIVE=OFF ^
          -DGGML_STATIC=OFF ^
          -DCMAKE_C_COMPILER_LAUNCHER=ccache ^
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ^
          -DCMAKE_SYSTEM_NAME=Windows

        REM Build the project
        cmake --build . -j %NUMBER_OF_PROCESSORS%

    - name: Copy ROCm core DLLs to build directory
      run: |
        $rocmVersion = if ($env:DETECTED_ROCM_VERSION) { $env:DETECTED_ROCM_VERSION } else { "${{ inputs.rocm_version }}" }
        $buildBinPath = "llama.cpp\build\bin"
        $rocmBinPath = "C:\opt\rocm\bin"

        Write-Host "Copying ROCm core DLL files to build directory..."
        Write-Host "Source: $rocmBinPath"
        Write-Host "Destination: $buildBinPath"

        if (Test-Path $rocmBinPath) {
          # Copy files matching patterns and specific names
          $filesToCopy = @(
            "amdhip64_*.dll",
            "rocm_kpack.dll",
            "amd_comgr*.dll",
            "libhipblas.dll",
            "rocblas.dll",
            "rocsolver.dll",
            "hipblaslt.dll",
            "libhipblaslt.dll",
            "hipblas.dll",
            "origami.dll"
          )

          foreach ($pattern in $filesToCopy) {
            $matchingFiles = Get-ChildItem -Path $rocmBinPath -Name $pattern -ErrorAction SilentlyContinue
            if ($matchingFiles) {
              foreach ($file in $matchingFiles) {
                $sourcePath = Join-Path $rocmBinPath $file
                $destPath = Join-Path $buildBinPath $file
                Copy-Item $sourcePath $destPath
                Write-Host "Copied: $file"
              }
            } else {
              Write-Host "Warning: No files found matching pattern: $pattern"
            }
          }

          # Copy the rocblas\library folder and all its contents
          $rocblasLibPath = Join-Path $rocmBinPath "rocblas\library"
          if (Test-Path $rocblasLibPath) {
            Write-Host "Copying rocblas\library folder and all contents..."
            $destRocblasPath = Join-Path $buildBinPath "rocblas\library"
            Copy-Item -Path $rocblasLibPath -Destination $destRocblasPath -Recurse -Force
            Write-Host "Copied: rocblas\library folder with all contents"

            # List the contents of the copied rocblas\library folder
            Write-Host "Contents of rocblas\library:"
            Get-ChildItem $destRocblasPath -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Warning: rocblas\library folder not found at: $rocblasLibPath"
          }

          # Copy the hipblaslt\library folder and all its contents
          $hipblasltLibPath = Join-Path $rocmBinPath "hipblaslt\library"
          if (Test-Path $hipblasltLibPath) {
            Write-Host "Copying hipblaslt\library folder and all contents..."
            $destHipblasltPath = Join-Path $buildBinPath "hipblaslt\library"
            Copy-Item -Path $hipblasltLibPath -Destination $destHipblasltPath -Recurse -Force
            Write-Host "Copied: hipblaslt\library folder with all contents"

            # List the contents of the copied hipblaslt\library folder
            Write-Host "Contents of hipblaslt\library:"
            Get-ChildItem $destHipblasltPath -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "Warning: rocblas\library folder not found at: $rocblasLibPath"
          }

          Write-Host "ROCm core files successfully copied to build directory"
        } else {
          Write-Error "ROCm bin directory not found: $rocmBinPath"
          exit 1
        }

    - name: List build artifacts (including ROCm files)
      run: |
        cd llama.cpp\build\bin
        Write-Host "Final build artifacts (including ROCm core files):"
        Get-ChildItem -Recurse | Format-Table Name, Length, LastWriteTime

    - name: Package bundle (zip)
      shell: bash
      run: |
        set -eux
        ASSET="app-${{ inputs.tag }}-windows-x64-rocm-${{ matrix.gfx_target }}.zip"
        mkdir -p dist
        (cd llama.cpp/build/bin && 7z a -tzip "${GITHUB_WORKSPACE}/dist/${ASSET}" .)
        ls -la dist

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v6
      with:
        name: app-${{ inputs.tag }}-windows-x64-rocm-${{ matrix.gfx_target }}
        path: dist/app-${{ inputs.tag }}-windows-x64-rocm-${{ matrix.gfx_target }}.zip
        if-no-files-found: error

    # ROCm is the first backend here to run device code through ccache, so log
    # the hit rate: a non-zero "unsupported source language" would mean the
    # device TUs are falling through to the real compiler uncached.
    - name: ccache stats
      continue-on-error: true
      run: ccache --show-stats -v

    - name: Evict stale ccache files
      # !cancelled(), unlike the save below: on a timeout the job gets a
      # single ~5 minute teardown window (measured ~4m50s after process
      # kill), shared by every remaining step and not replenished. Evicting
      # spends that window on housekeeping; the save is what actually needs
      # it, and a 2 GB cache is not quick to write.
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: ccache --evict-older-than 14d

    - name: Save ccache
      # Save even when the build failed: the objects compiled before the
      # failure are still worth keeping, and a job that saves nothing leaves
      # a hole in the cache lineage that widens the next run's tag gap.
      # Measured: gap 7 -> 68% hit rate, gap 13 -> 6%.
      #
      # always(), not !cancelled(): a timeout-minutes expiry puts the job on
      # the CANCELLATION path, not the failure path, so !cancelled() would
      # skip the save on the single most expensive case -- a leg that
      # compiled for hours and then hit the cap.
      if: ${{ always() }}
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}\.ccache
        key: ccache-rocm-windows-${{ matrix.gfx_target }}-${{ env.DETECTED_ROCM_VERSION }}-${{ inputs.tag }}-

  build-ubuntu:
    name: linux/${{ matrix.gfx_target }}
    runs-on: ubuntu-22.04
    if: contains(inputs.operating_systems, 'ubuntu')
    strategy:
      matrix: ${{ fromJson(inputs.matrix) }}
      fail-fast: false

    steps:
    - name: Free disk space
      # Remove unused runner files to free up disk space
      run: curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash

    - name: Clean up existing directories (safety precaution)
      run: |
        # Remove existing llama.cpp directory if it exists
        if [ -d "llama.cpp" ]; then
          echo "Removing existing llama.cpp directory..."
          rm -rf llama.cpp
        fi

        # Remove existing /opt/rocm directory if it exists
        if [ -d "/opt/rocm" ]; then
          echo "Removing existing /opt/rocm directory..."
          sudo rm -rf /opt/rocm
        fi

        # Remove any existing ROCm tarball
        if [ -f "rocm.tar.gz" ]; then
          echo "Removing existing rocm.tar.gz..."
          rm -f rocm.tar.gz
        fi

        echo "Cleanup completed successfully"

    - name: Install build dependencies
      run: |
        echo "Installing build dependencies..."
        sudo apt update
        sudo apt install -y cmake ninja-build unzip curl

        # Verify installations
        echo "Verifying installations..."
        cmake --version
        ninja --version
        echo "Build dependencies installation completed"

    - name: Download and extract ROCm directly to /opt/rocm
      run: |
        # Determine ROCm version to use
        rocm_version="${{ inputs.rocm_version }}"
        current_target="${{ matrix.gfx_target }}"

        # Map the build target to the matching TheRock archive family
        archive_target="$current_target"
        if [[ "$current_target" = "gfx103X" || "$current_target" = "gfx110X" || "$current_target" = "gfx120X" ]]; then
          archive_target="${current_target}-all"
          echo "Using target with -all suffix: $archive_target"
        fi

        # TheRock publishes nightlies to the multi-arch tarball index. The
        # static HTML page embeds a JSON `files` array with names and mtimes.
        base_url="https://rocm.nightlies.amd.com/tarball-multi-arch"
        if [ "$rocm_version" = "latest" ] || [ "$rocm_version" = "weekly" ]; then
          # weekly: take the newest alpha up to the Saturday before the last SF Sunday, so a whole week uses one toolchain and the ccache hits.
          # The cutoff day must be settled before the first run reads it: TheRock usually publishes the evening before, but has landed as late as 18:33 PT on the named day, which splits the week.
          # The parent sends one cutoff for the run, so every leg agrees; the fallback is for a standalone call.
          cutoff=99999999
          if [ "$rocm_version" = "weekly" ]; then
            cutoff="${{ inputs.rocm_cutoff }}"
            [ -n "$cutoff" ] || cutoff="$(TZ=America/Los_Angeles date -d "-$(( $(TZ=America/Los_Angeles date +%w) + 1 )) days" +%Y%m%d)"
            echo "Weekly pin: newest build dated on or before $cutoff (week of the last SF Sunday)"
          else
            echo "Auto-detecting latest ROCm version for target: $current_target"
          fi
          prefix="therock-dist-linux-${archive_target}-"
          files_json=$(curl -s "$base_url/" | tr '\n' ' ' | grep -oP 'const files = \K\[.*?\](?=\s*;)')
          if [ -z "$files_json" ]; then
            echo "Failed to parse file index from $base_url/"
            exit 1
          fi

          # Pick the newest build date and exclude sibling test archives.
          latest_file=$(echo "$files_json" | jq -r --arg p "$prefix" --arg c "$cutoff" \
            '[.[] | select(.name | test("^" + $p + "[0-9]+\\.[0-9]+\\.[0-9]+(a|rc)[0-9]+\\.tar\\.gz$")) | select((.name | capture("(?<d>[0-9]{8})\\.tar\\.gz$").d) <= $c)] | sort_by(.name | capture("(?<d>[0-9]{8})\\.tar\\.gz$").d) | last | .name // empty')
          if [ -z "$latest_file" ]; then
            echo "No tarball found for prefix '$prefix' at or before $cutoff at $base_url/"
            exit 1
          fi
          echo "Found latest file: $latest_file"

          # Extract version from the filename for environment variable
          if [[ "$latest_file" =~ therock-dist-linux-${archive_target}-([0-9]+\.[0-9]+\.[0-9]+(a|rc)[0-9]+)\.tar\.gz ]]; then
            rocm_version="${BASH_REMATCH[1]}"
            echo "Detected latest ROCm version: $rocm_version"
          else
            echo "Failed to extract ROCm version from latest file: $latest_file"
            echo "Expected pattern: therock-dist-linux-${archive_target}-<version>.tar.gz"
            exit 1
          fi

          rocm_url="$base_url/$latest_file"
        else
          rocm_url="$base_url/therock-dist-linux-${archive_target}-${rocm_version}.tar.gz"
        fi

        # Store the version for use in other steps
        echo "DETECTED_ROCM_VERSION=$rocm_version" >> $GITHUB_ENV

        echo "Streaming ROCm from: $rocm_url directly to extraction"

        # Create directory if it doesn't exist
        sudo mkdir -p /opt/rocm

        # Stream download directly into tar extraction (no intermediate file)
        curl -sL "$rocm_url" | sudo tar --use-compress-program=gzip -xf - -C /opt/rocm --strip-components=1

    - name: Set ROCm environment variables
      run: |
        echo "Setting ROCm environment variables..."

        # Set environment variables for this step and subsequent steps
        echo "HIP_PATH=/opt/rocm" >> $GITHUB_ENV
        echo "ROCM_PATH=/opt/rocm" >> $GITHUB_ENV
        echo "HIP_PLATFORM=amd" >> $GITHUB_ENV
        echo "HIP_CLANG_PATH=/opt/rocm/llvm/bin" >> $GITHUB_ENV
        echo "HIP_INCLUDE_PATH=/opt/rocm/include" >> $GITHUB_ENV
        echo "HIP_LIB_PATH=/opt/rocm/lib" >> $GITHUB_ENV
        echo "HIP_DEVICE_LIB_PATH=/opt/rocm/lib/llvm/amdgcn/bitcode" >> $GITHUB_ENV

        # Update PATH
        echo "/opt/rocm/bin:/opt/rocm/llvm/bin:$PATH" >> $GITHUB_PATH

        # Set library paths
        echo "LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:/opt/rocm/llvm/lib:${LD_LIBRARY_PATH:-}" >> $GITHUB_ENV
        echo "LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:${LIBRARY_PATH:-}" >> $GITHUB_ENV
        echo "CPATH=/opt/rocm/include:${CPATH:-}" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=/opt/rocm/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> $GITHUB_ENV

        echo "ROCm environment variables set successfully"

    # See the Windows job for why the key is per gfx target and ROCm version, and why save: false.
    - name: ccache
      uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
      with:
        key: rocm-linux-${{ matrix.gfx_target }}-${{ env.DETECTED_ROCM_VERSION }}-${{ inputs.tag }}
        restore-keys: |
          rocm-linux-${{ matrix.gfx_target }}-${{ env.DETECTED_ROCM_VERSION }}
        append-timestamp: false
        variant: ccache
        max-size: 2G
        save: false

    # The action sets this on Windows and macOS but leaves Linux on mtime, and ROCm is re-extracted every run, so mtime is not a reliable compiler identity.
    - name: Hash the compiler by content, not mtime
      run: ccache --set-config=compiler_check=content

    # The parent's resolve job built the source tree (upstream base + any mix
    # PRs, with the build number/commit and Unsloth fingerprint baked
    # into cmake/build-info.cmake) and uploaded it as an artifact; extract it
    # instead of cloning -- no .git needed, the build number is already baked.
    - name: Download source @ ${{ inputs.tag }}
      uses: actions/download-artifact@v6
      with:
        name: ${{ inputs.source_artifact }}
        path: srcpkg
    - name: Extract source
      shell: bash
      run: |
        set -eux
        mkdir -p llama.cpp
        tar -xzf "srcpkg/llama.cpp-source-${{ inputs.tag }}.tar.gz" -C llama.cpp --strip-components=1

    - name: Build Llama.cpp + ROCm
      run: |
        # Map GPU targets
        current_target="${{ matrix.gfx_target }}"
        echo "Input target: $current_target"

        if [ "$current_target" = "gfx110X" ]; then
          mapped_target="gfx1100;gfx1101;gfx1102;gfx1103"
        elif [ "$current_target" = "gfx103X" ]; then
          mapped_target="gfx1030;gfx1031;gfx1032;gfx1034"
        elif [ "$current_target" = "gfx1151" ]; then
          mapped_target="gfx1151"
        elif [ "$current_target" = "gfx1150" ]; then
          mapped_target="gfx1150"
        elif [ "$current_target" = "gfx120X" ]; then
          mapped_target="gfx1200;gfx1201"
        else
          mapped_target="$current_target"
        fi
        echo "Mapped target: $mapped_target"

        # Create build directory
        cd llama.cpp
        mkdir build
        cd build

        # Configure the project
        # CMAKE_HIP_COMPILER_LAUNCHER is needed here but not on Windows: the
        # CXX compiler is ROCm's clang++ (not hipcc), so ggml-hip leaves
        # CXX_IS_HIPCC false and calls enable_language(HIP), putting the device
        # sources on the HIP language rather than CXX.
        cmake .. -G Ninja \
          -DCMAKE_C_COMPILER=/opt/rocm/llvm/bin/clang \
          -DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ \
          -DCMAKE_CXX_FLAGS="-I/opt/rocm/include" \
          -DCMAKE_CROSSCOMPILING=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DGPU_TARGETS="$mapped_target" \
          -DBUILD_SHARED_LIBS=ON \
          -DLLAMA_BUILD_TESTS=OFF \
          -DGGML_HIP=ON \
          -DGGML_OPENMP=OFF \
          -DGGML_CUDA_FORCE_CUBLAS=OFF \
          -DGGML_RPC=ON \
          -DGGML_HIP_ROCWMMA_FATTN=OFF \
          -DLLAMA_BUILD_BORINGSSL=ON \
          -DGGML_NATIVE=OFF \
          -DGGML_STATIC=OFF \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_HIP_COMPILER_LAUNCHER=ccache \
          -DCMAKE_SYSTEM_NAME=Linux

        # Build the project
        cmake --build . -j $(nproc)

    - name: Copy ROCm core libs to build directory
      run: |
        build_bin_path="llama.cpp/build/bin"
        rocm_bin_path="/opt/rocm/bin"

        # Copy the rocblas/library folder and all its contents
        rocblas_lib_path="/opt/rocm/lib/rocblas/library"
        if [ -d "$rocblas_lib_path" ]; then
          echo "Copying rocblas/library folder and all contents..."
          dest_rocblas_path="$build_bin_path/rocblas/library"
          mkdir -p "$(dirname "$dest_rocblas_path")"
          cp -r "$rocblas_lib_path" "$(dirname "$dest_rocblas_path")/"
          echo "Copied: rocblas/library folder with all contents"

          # List the contents of the copied rocblas/library folder
          echo "Contents of rocblas/library:"
          find "$dest_rocblas_path" -type f -exec ls -la {} \; | head -20
        else
          echo "Warning: rocblas/library folder not found at: $rocblas_lib_path"
        fi

        # Copy the hipblaslt/library folder and all its contents
        hipblaslt_lib_path="/opt/rocm/lib/hipblaslt/library"
        if [ -d "$hipblaslt_lib_path" ]; then
          echo "Copying hipblaslt/library folder and all contents..."
          dest_hipblaslt_path="$build_bin_path/hipblaslt/library"
          mkdir -p "$(dirname "$dest_hipblaslt_path")"
          cp -r "$hipblaslt_lib_path" "$(dirname "$dest_hipblaslt_path")/"
          echo "Copied: hipblaslt/library folder with all contents"

          # List the contents of the copied hipblaslt/library folder
          echo "Contents of hipblaslt/library:"
          find "$dest_hipblaslt_path" -type f -exec ls -la {} \; | head -20
        else
          echo "Warning: hipblaslt/library folder not found at: $hipblaslt_lib_path"
        fi

        # Copy required ROCm libraries to build directory
        # If artifacts from ROCm or Llama.cpp change, you may need to update this list
        # To get a new list of all libraries, run:
        # gather_required_libs.py --rocm-dir /opt/rocm --dest-dir llama.cpp/build/bin
        echo "Copying required ROCm libraries to build directory..."
        cp -v /opt/rocm/lib/libhipblas.so* "$build_bin_path/" 2>/dev/null || echo "libhipblas.so* not found"
        cp -v /opt/rocm/lib/librocblas.so* "$build_bin_path/" 2>/dev/null || echo "librocblas.so* not found"
        cp -v /opt/rocm/lib/libamdhip64.so* "$build_bin_path/" 2>/dev/null || echo "libamdhip64.so* not found"
        cp -v /opt/rocm/lib/librocsolver.so* "$build_bin_path/" 2>/dev/null || echo "librocsolver.so* not found"
        cp -v /opt/rocm/lib/libroctx64.so* "$build_bin_path/" 2>/dev/null || echo "libroctx64.so* not found"
        cp -v /opt/rocm/lib/libhipblaslt.so* "$build_bin_path/" 2>/dev/null || echo "libhipblaslt.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_liblzma.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_liblzma.so* not found"
        cp -v /opt/rocm/lib/librocprofiler-register.so* "$build_bin_path/" 2>/dev/null || echo "librocprofiler-register.so* not found"
        cp -v /opt/rocm/lib/libamd_comgr.so* "$build_bin_path/" 2>/dev/null || echo "libamd_comgr.so* not found"
        cp -v /opt/rocm/lib/libamd_comgr_loader.so* "$build_bin_path/" 2>/dev/null || echo "libamd_comgr_loader.so* not found"
        cp -v /opt/rocm/lib/libhsa-runtime64.so* "$build_bin_path/" 2>/dev/null || echo "libhsa-runtime64.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_numa.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_numa.so* not found"
        cp -v /opt/rocm/lib/librocroller.so* "$build_bin_path/" 2>/dev/null || echo "librocroller.so* not found"
        cp -v /opt/rocm/lib/liborigami.so* "$build_bin_path/" 2>/dev/null || echo "liborigami.so* not found"
        cp -v /opt/rocm/lib/librocm_kpack.so* "$build_bin_path/" 2>/dev/null || echo "librocm_kpack.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_z.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_z.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_zstd.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_zstd.so* not found"
        cp -v /opt/rocm/lib/llvm/lib/libLLVM.so* "$build_bin_path/" 2>/dev/null || echo "libLLVM.so* not found"
        cp -v /opt/rocm/lib/llvm/lib/libclang-cpp.so* "$build_bin_path/" 2>/dev/null || echo "libclang-cpp.so* not found"

        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_elf.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_elf.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_drm.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_drm.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_drm_amdgpu.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_drm_amdgpu.so* not found"
        cp -v /opt/rocm/lib/rocm_sysdeps/lib/librocm_sysdeps_bz2.so* "$build_bin_path/" 2>/dev/null || echo "librocm_sysdeps_bz2.so* not found"

        # libatomic.so.1 is a transitive dependency of librocm_sysdeps_numa
        # (libhsa-runtime64 -> numa -> libatomic) but it is a system GCC runtime
        # library, not shipped under /opt/rocm. Bundle it so the runtime stays
        # self-contained on hosts that lack it. lemonade-sdk/lemonade#1349 hit
        # exactly this ("libatomic.so.1: cannot open shared object file").
        sudo apt-get install -y libatomic1 >/dev/null 2>&1 || true
        libatomic_path="$(ldconfig -p | awk -F'=> ' '/libatomic\.so\.1/{print $2; exit}')"
        cp -v "$libatomic_path" "$build_bin_path/" 2>/dev/null || echo "libatomic.so.1 not found"

        echo "Finished copying required ROCm libraries"

    - name: Set RPATH for portable distribution
      run: |
        sudo apt-get install -y patchelf
        cd llama.cpp/build/bin
        # Set RPATH to $ORIGIN so all libraries (including the comgr stub loader) find deps locally
        for file in *.so* llama-*; do
          [ -f "$file" ] && [ ! -L "$file" ] && patchelf --set-rpath '$ORIGIN' "$file" 2>/dev/null || true
        done

    - name: List build artifacts (including ROCm files)
      run: |
        cd llama.cpp/build/bin
        echo "Final build artifacts (including ROCm library files):"
        ls -la

    - name: Package bundle (tar.gz)
      run: |
        set -eux
        ASSET="app-${{ inputs.tag }}-linux-x64-rocm-${{ matrix.gfx_target }}.tar.gz"
        mkdir -p dist
        (cd llama.cpp/build/bin && tar -czf "${GITHUB_WORKSPACE}/dist/${ASSET}" .)
        ls -la dist

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v6
      with:
        name: app-${{ inputs.tag }}-linux-x64-rocm-${{ matrix.gfx_target }}
        path: dist/app-${{ inputs.tag }}-linux-x64-rocm-${{ matrix.gfx_target }}.tar.gz
        if-no-files-found: error

    # See the Windows job: logs whether the HIP-language TUs actually cache.
    - name: ccache stats
      continue-on-error: true
      run: ccache --show-stats -v

    - name: Evict stale ccache files
      # !cancelled(), unlike the save below: on a timeout the job gets a
      # single ~5 minute teardown window (measured ~4m50s after process
      # kill), shared by every remaining step and not replenished. Evicting
      # spends that window on housekeeping; the save is what actually needs
      # it, and a 2 GB cache is not quick to write.
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: ccache --evict-older-than 14d

    - name: Save ccache
      # Save even when the build failed: the objects compiled before the
      # failure are still worth keeping, and a job that saves nothing leaves
      # a hole in the cache lineage that widens the next run's tag gap.
      # Measured: gap 7 -> 68% hit rate, gap 13 -> 6%.
      #
      # always(), not !cancelled(): a timeout-minutes expiry puts the job on
      # the CANCELLATION path, not the failure path, so !cancelled() would
      # skip the save on the single most expensive case -- a leg that
      # compiled for hours and then hit the cap.
      if: ${{ always() }}
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ccache-rocm-linux-${{ matrix.gfx_target }}-${{ env.DETECTED_ROCM_VERSION }}-${{ inputs.tag }}-
