name: "Unsloth prebuilt: macOS"

# Reusable child of unsloth-prebuilt.yml. Builds the macOS slices (arm64 Metal +
# x64 CPU) the parent's `resolve` job placed in `matrix`. Each entry uploads a
# single app-*.tar.gz artifact for the parent's assemble step to pick up.
#
# The only change over ggml-org's own macos build is an explicit
# -DCMAKE_OSX_DEPLOYMENT_TARGET per slice, so the binaries declare their load
# floor instead of inheriting the runner OS. Upstream stopped pinning this on
# arm64 (their macos-26 runner stamps minos=26, which fails to dyld-load on
# macOS < 26); owning the build is how we keep a loadable floor.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Upstream llama.cpp release tag (b####), resolved by parent'
        required: true
        type: string
      repo:
        description: 'Source repo (owner/name): ggml-org/llama.cpp for plain builds, or this repo for mix tags'
        required: false
        default: 'ggml-org/llama.cpp'
        type: string
      source_artifact:
        description: 'Workflow artifact (app-source-*) holding the stamped source tree; set by resolve for every build'
        required: false
        default: ''
        type: string
      matrix:
        description: 'Matrix JSON {include:[...]} produced by the parent resolve job'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.build }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout build tooling (this repo)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: tooling
          persist-credentials: false

      # The parent's resolve job built the source tree (upstream base + any mix
      # PRs, with the build number/commit and Unsloth fingerprint baked
      # into cmake/build-info.cmake) and uploaded it as an artifact; extract it
      # instead of cloning -- no .git needed, the build number is already baked.
      - name: Download source @ ${{ inputs.tag }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: ${{ inputs.source_artifact }}
          path: srcpkg
      - name: Extract source
        shell: bash
        run: |
          set -eux
          mkdir -p src
          tar -xzf "srcpkg/llama.cpp-source-${{ inputs.tag }}.tar.gz" -C src --strip-components=1

      # The macOS legs were the last build jobs without a compiler cache. Metal's
      # backend is Objective-C, and the arm64 leg is the only one that builds it
      # (the x64 leg passes -DGGML_METAL=OFF), so the OBJC launchers matter here
      # in a way they do not elsewhere. Setting a launcher for a language this
      # build never enables is inert, so both are set unconditionally.
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: macos-${{ matrix.build }}-${{ matrix.deploy_target }}-${{ inputs.tag }}
          restore-keys: |
            macos-${{ matrix.build }}-${{ matrix.deploy_target }}
          append-timestamp: false
          variant: ccache
          max-size: 2G
          save: false

      - name: Build (deployment target ${{ matrix.deploy_target }})
        working-directory: src
        run: |
          set -euo pipefail
          cmake -B build \
            ${{ matrix.defines }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.deploy_target }} \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON
          cmake --build build --config Release -j "$(sysctl -n hw.logicalcpu)"

      - name: Load gate (minos <= ${{ matrix.deploy_target }}, arch, launch)
        run: bash tooling/scripts/unsloth/assert_macho_minos.sh src/build/bin "${{ matrix.expect_arch }}" "${{ matrix.deploy_target }}"

      # DiffusionGemma binaries (example targets present only in #24423 mix
      # builds): best-effort, never fail the job. Built after the load gate so
      # they do not affect the required-binary minos check; the same cached
      # deployment target applies. The bundle tars all of build/bin, so anything
      # produced here is shipped automatically.
      - name: Build DiffusionGemma binaries (best-effort; mix builds only)
        working-directory: src
        run: |
          set -u
          if [ ! -d examples/diffusion-gemma-server ]; then
            echo "no DiffusionGemma sources in this tree; skipping"
            exit 0
          fi
          cmake -B build -DLLAMA_BUILD_EXAMPLES=ON \
            || { echo "reconfigure for examples failed; skipping DiffusionGemma binaries"; exit 0; }
          if cmake --build build --config Release -j "$(sysctl -n hw.logicalcpu)" \
              --target llama-diffusion-gemma-visual-server llama-diffusion-cli; then
            echo "built DiffusionGemma binaries"
          else
            echo "warning: DiffusionGemma binaries failed to build; bundle will omit them"
          fi
          exit 0

      - name: Package bundle
        working-directory: src
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          cp LICENSE build/bin/
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # BSD tar (-s) rewrites the leading ./ to llama-<tag>/ so the archive
          # unpacks into a named dir, matching upstream's own macos tarball layout.
          tar -czf "$GITHUB_WORKSPACE/dist/llama-${TAG}-bin-macos-${{ matrix.build }}.tar.gz" \
            -s ",^\.,llama-${TAG}," -C build/bin .

      - name: Upload bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: app-${{ inputs.tag }}-macos-${{ matrix.build }}
          path: dist/llama-${{ inputs.tag }}-bin-macos-${{ matrix.build }}.tar.gz
          if-no-files-found: error

      - name: Evict stale ccache files
        # !cancelled(), unlike the save below: on a timeout the job gets a
        # single ~5 minute teardown window (measured ~4m50s after process
        # kill), shared by every remaining step and not replenished. Evicting
        # spends that window on housekeeping; the save is what actually needs
        # it, and a 2 GB cache is not quick to write.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ccache --evict-older-than 14d

      - name: Save ccache
        # Save even when the build failed: the objects compiled before the
        # failure are still worth keeping, and a job that saves nothing leaves
        # a hole in the cache lineage that widens the next run's tag gap.
        # Measured: gap 7 -> 68% hit rate, gap 13 -> 6%.
        #
        # always(), not !cancelled(): a timeout-minutes expiry puts the job on
        # the CANCELLATION path, not the failure path, so !cancelled() would
        # skip the save on the single most expensive case -- a leg that
        # compiled for hours and then hit the cap.
        if: ${{ always() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ matrix.build }}-${{ matrix.deploy_target }}-${{ inputs.tag }}-
