name: Unsloth prebuilt (full release)

# Atomic daily build for unslothai/llama.cpp. One cron, one workflow run, one
# release per upstream b#### tag. Splits the heavy build work into six reusable
# children:
#   unsloth-prebuilt-cuda.yml          -- Linux CUDA bundles (x64 + arm64, matrix profiles)
#   unsloth-prebuilt-cuda-windows.yml  -- CUDA Windows bundles (x64, matrix profiles)
#   unsloth-prebuilt-rocm.yml          -- ROCm bundles (Windows + Ubuntu, per gfx target)
#   unsloth-prebuilt-macos.yml         -- macOS bundles (arm64 Metal + x64 CPU)
#   unsloth-prebuilt-cpu.yml           -- CPU-only bundles (Linux + Windows, x64 + arm64)
#   unsloth-prebuilt-vulkan.yml        -- Vulkan bundles (Linux x64/arm64 + Windows x64)
#
# Atomicity: the `assemble` job depends on all children. GitHub's default
# `needs` semantics require all needs to succeed -- if any matrix entry in
# any child fails, `assemble` skips and no release is published. The
# installer needs the full bundle set at the same tag or it'll dispatch to
# something that isn't there.
#
# Mix builds: scripts/unsloth/pr-set.json can list ggml-org/llama.cpp or
# unslothai/llama.cpp PRs (each pinned to an exact commit) to merge into the
# build. `resolve` merges the open ones onto the base tag and uploads the
# merged tree as a workflow artifact that the children extract instead of
# cloning; the release is tagged b####-mix-<hash>. Empty list = vanilla
# upstream build.

on:
  schedule:
    - cron: '13 20 * * *'      # ~1PM San Francisco PDT / ~12PM PST (UTC; not DST adjusted)
  workflow_dispatch:
    inputs:
      tag:
        description: 'ggml-org tag (b#### or "latest")'
        default: 'latest'
        required: true
        type: string
      min_age_hours:
        description: 'For "latest": only build a release public for at least this many hours (blank = default 6)'
        default: ''
        required: false
        type: string
      only_profile:
        description: 'CUDA profile to build'
        default: 'all'
        required: false
        type: choice
        options: [all, cuda12-legacy, cuda12-older, cuda12-newer, cuda12-portable, cuda13-older, cuda13-newer, cuda13-portable]
      operating_systems:
        description: 'OSes for ROCm builds'
        default: 'windows,ubuntu'
        required: false
        type: string
      gfx_target:
        description: 'GPU targets for ROCm builds'
        default: 'gfx1151,gfx1150,gfx120X,gfx110X,gfx103X,gfx90a,gfx908'
        required: false
        type: string
      rocm_version:
        description: 'ROCm version, "weekly" (newest alpha as of the last SF Sunday) or "latest"'
        default: 'weekly'
        required: false
        type: string
      publish:
        description: 'Publish to GitHub Releases'
        default: false
        required: false
        type: boolean

permissions:
  contents: write

env:
  # Supply-chain aging: when resolving "latest", only build an upstream release
  # that has been public for at least this many hours, so a malicious or broken
  # release has time to be caught and yanked before we compile and ship it. An
  # explicit b#### tag (manual run) skips it. Per-run override via min_age_hours.
  UNSLOTH_LLAMA_MIN_RELEASE_AGE_HOURS: "6"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || 'scheduled' }}
  # A nightly still in flight when the next one starts is stuck, not busy: a
  # healthy run finishes in a couple of hours. Leaving this false lets one
  # wedged run block every following nightly with nothing to show for it.
  # Only the schedule supersedes; a manual dispatch never kills a live nightly.
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-24.04
    # Read-only: resolve merges third-party PR content but pushes nothing;
    # only assemble needs the workflow-level contents:write (publish).
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      repo: ${{ steps.r.outputs.repo }}
      base: ${{ steps.r.outputs.base }}
      prs: ${{ steps.r.outputs.prs }}
      source_artifact: ${{ steps.r.outputs.source_artifact }}
      commit: ${{ steps.r.outputs.commit }}
      ggml_tree: ${{ steps.r.outputs.ggml_tree }}
      ggml_version: ${{ steps.r.outputs.ggml_version }}
      exists: ${{ steps.r.outputs.exists }}
      cuda_matrix: ${{ steps.r.outputs.cuda_matrix }}
      win_cuda_matrix: ${{ steps.r.outputs.win_cuda_matrix }}
      rocm_matrix: ${{ steps.r.outputs.rocm_matrix }}
      rocm_cutoff: ${{ steps.r.outputs.rocm_cutoff }}
      macos_matrix: ${{ steps.r.outputs.macos_matrix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Shallow by default (only pr-set.json is needed); a mix build unshallows
      # in-place to merge the PRs.
      - name: Checkout (pr-set.json + mix merge workspace)
        uses: actions/checkout@v6
      - id: r
        run: |
          set -euo pipefail
          REQ='${{ github.event.inputs.tag || 'latest' }}'
          ONLY='${{ github.event.inputs.only_profile || 'all' }}'
          GFX_DEFAULT='gfx1151,gfx1150,gfx120X,gfx110X,gfx103X,gfx90a,gfx908'
          GFX='${{ github.event.inputs.gfx_target }}'; GFX="${GFX:-$GFX_DEFAULT}"
          OS_LIST='${{ github.event.inputs.operating_systems || 'windows,ubuntu' }}'
          AGE_H='${{ github.event.inputs.min_age_hours }}'

          # publish does delete-then-create on the whole release, and the installer
          # treats the published manifest as the authoritative bundle set: a partial
          # build drops bundles and silently downgrades uncovered hosts to slow
          # source builds. Refuse to publish unless the full default set is built;
          # publish=false test runs may use subsets.
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            [ "$ONLY" = "all" ] || { echo "refusing to publish only_profile=$ONLY: a partial CUDA set clobbers manifest coverage. Use only_profile=all to publish, or publish=false for an artifact-only test." >&2; exit 1; }
            [ "$GFX" = "$GFX_DEFAULT" ] || { echo "refusing to publish gfx_target='$GFX': publish requires the full default set ($GFX_DEFAULT); use publish=false for a subset test." >&2; exit 1; }
            case "$OS_LIST" in
              *windows*ubuntu*|*ubuntu*windows*) : ;;
              *) echo "refusing to publish operating_systems='$OS_LIST': both windows and ubuntu ROCm bundles are required. Use publish=false for a subset test." >&2; exit 1 ;;
            esac
          fi
          [ -n "$AGE_H" ] || AGE_H="${UNSLOTH_LLAMA_MIN_RELEASE_AGE_HOURS:-6}"
          if [ "$REQ" = "latest" ]; then
            # Newest published (non-draft, non-prerelease) release that has been
            # public for >= AGE_H hours -- the supply-chain aging window. GitHub
            # does not guarantee the list order, so pick the max by published_at
            # explicitly rather than trusting `first`.
            CUTOFF="$(date -u -d "-${AGE_H} hours" +%s)"
            BASE="$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=100' \
              --jq "[.[] | select(.draft==false and .prerelease==false) | select((.published_at|fromdateiso8601) <= ${CUTOFF})] | max_by(.published_at|fromdateiso8601) | .tag_name")"
            if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
              echo "refusing: no ggml-org release older than ${AGE_H}h in the last 100 releases" >&2
              exit 1
            fi
            echo "selected $BASE (aged >= ${AGE_H}h)"
          else
            BASE="$REQ"   # explicit b#### override skips the aging filter
          fi
          printf '%s' "$BASE" | grep -qE '^b[0-9]+$' || { echo "refusing non-release tag '$BASE'" >&2; exit 1; }

          # Resolve the PR mix set (scripts/unsloth/pr-set.json): PR commit
          # urls from ggml-org/llama.cpp or unslothai/llama.cpp (no other
          # repos). Pins are mandatory -- only an exact, reviewed commit
          # is ever built, so a PR author pushing more commits cannot change
          # what the nightly ships. Non-open PRs are skipped, so merged or
          # abandoned entries rot away instead of breaking the nightly (but a
          # merged unslothai pin drops out of the build entirely; see the
          # pr-set.json _doc). unsloth-pr-set-lint.yml runs the same checks on every
          # push that edits the file, but that is only a tripwire -- a red
          # lint does not stop the schedule, so the gate must live here.
          # An entry is a bare url string (required) or {"url", "required": false}.
          # Bare strings stay valid, so the file needs no migration.
          jq -e '.prs | type == "array" and all(.[];
                   type == "string"
                   or (type == "object" and (.url | type == "string")
                       and ((if .required == null then true else .required end) | type == "boolean")))' \
             scripts/unsloth/pr-set.json >/dev/null \
            || { echo "scripts/unsloth/pr-set.json: .prs must be an array of PR url strings, or {url, required} objects" >&2; exit 1; }
          PRS='[]'
          URL_RE='^https://github\.com/(ggml-org|unslothai)/llama\.cpp/pull/([0-9]+)/commits/([0-9a-f]{40})/?$'
          while read -r url REQUIRED; do
            [[ "$url" =~ $URL_RE ]] || { echo "refusing malformed PR url '$url' (expected https://github.com/{ggml-org,unslothai}/llama.cpp/pull/<n>/commits/<40-hex-sha>)" >&2; exit 1; }
            SRC="${BASH_REMATCH[1]}/llama.cpp"; NUM="${BASH_REMATCH[2]}"; SHA="${BASH_REMATCH[3]}"
            # Abort naming the entry on a gh failure (typo'd numbers 404).
            # Title can contain spaces, so it can't ride a space-delimited
            # read -- pull each field out on its own.
            PR_JSON="$(gh api "repos/${SRC}/pulls/${NUM}")" \
              || { echo "refusing ${SRC}#${NUM}: could not fetch PR metadata (nonexistent PR number in '$url', or a transient API failure); fix the pin in scripts/unsloth/pr-set.json or retry" >&2; exit 1; }
            STATE="$(jq -r '.state' <<<"$PR_JSON")"
            HEAD="$(jq -r '.head.sha' <<<"$PR_JSON")"
            N_COMMITS="$(jq -r '.commits' <<<"$PR_JSON")"
            TITLE="$(jq -r '.title' <<<"$PR_JSON")"
            if [ "$STATE" != "open" ]; then
              # A non-open pin drops out of $PRS, changing SETHASH and the tag, so
              # the release would ship without that arch under a new tag. Refuse
              # unless the entry is explicitly optional.
              if [ "$REQUIRED" != "false" ]; then
                echo "refusing ${SRC}#${NUM}: pin is ${STATE}, and it is a required entry; publishing without it would silently drop its architecture. Mark it \"required\": false in scripts/unsloth/pr-set.json to ship without it, or repin it." >&2
                exit 1
              fi
              echo "::warning::skipping optional pin ${SRC}#${NUM} (${STATE}): $url"
              continue
            fi
            # A pin pasted from the wrong PR would build arbitrary code while
            # the manifest blames PR #<num>; require the pinned commit to be
            # a commit of that PR. The commits listing is capped at 250 by
            # the API; past that, skip rather than false-fail.
            if [ "$N_COMMITS" -gt 250 ]; then
              echo "note: ${SRC}#${NUM} has ${N_COMMITS} commits (over the API listing cap); skipping pin membership check"
            elif ! gh api "repos/${SRC}/pulls/${NUM}/commits" --paginate --jq '.[].sha' | grep -qx "$SHA"; then
              echo "refusing ${SRC}#${NUM}: pinned commit ${SHA} is not a commit of that PR (wrong paste, or force-pushed away); fix the pin in scripts/unsloth/pr-set.json" >&2
              exit 1
            fi
            [ "$SHA" = "$HEAD" ] || echo "note: ${SRC}#${NUM} is pinned to ${SHA} but its head has moved to ${HEAD}"
            echo "including ${SRC}#${NUM} @ ${SHA}"
            PRS="$(jq -c --arg r "$SRC" --arg n "$NUM" --arg s "$SHA" --arg u "$url" --arg t "$TITLE" '. + [{repo: $r, number: ($n|tonumber), sha: $s, url: $u, title: $t}]' <<<"$PRS")"
          done < <(jq -r '.prs[] | if type == "string" then {url: ., required: true} else . end
                          | "\(.url)\t\(if .required == null then true else .required end)"' scripts/unsloth/pr-set.json | tr '\t' ' ')

          # Decide the tag and source repo first; the source tree is built
          # further down, only if this release isn't already published.
          if [ "$(jq length <<<"$PRS")" = 0 ]; then
            # Plain build: pristine upstream base, no merge. REPO stays the real
            # upstream repo even though we ship our own stamped tarball.
            TAG="$BASE"
            REPO='ggml-org/llama.cpp'
          else
            # The synthetic tag embeds a hash of the pinned repo#number:sha
            # triples in listed order (merge order can matter for conflicts), so
            # a pin update or a reorder yields a new tag and build, while the
            # "exists" check below still skips rebuilding an already-published
            # set. The repo is part of the key so PR #n in the two repos can't
            # hash to the same set. The merged tree exists only as this repo's
            # release assets, never upstream.
            SETHASH="$(jq -r 'map("\(.repo)#\(.number):\(.sha)") | join("\n")' <<<"$PRS" | sha256sum | cut -c1-7)"
            TAG="${BASE}-mix-${SETHASH}"
            REPO="$GITHUB_REPOSITORY"
          fi
          SRC_ARTIFACT="app-source-${TAG}"
          COMMIT=""
          GGML_TREE=""
          GGML_VERSION=""

          # Only PUBLISHED releases count as "exists"; a leftover draft (from
          # a failed prior publish) should not block today's rebuild.
          EXISTS=false
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)" = "false" ]; then
            EXISTS=true
          fi

          # Build the source tree every child compiles, ONCE, here -- but only
          # when something will actually be built. On a scheduled no-op (the aged
          # "latest" was already published) skip the whole checkout/merge/tar +
          # upload; a manual dispatch always rebuilds. Check out the upstream base,
          # merge any pinned PRs (mix builds), then bake the build number/commit
          # and the Unsloth fingerprint into cmake/build-info.cmake. The
          # result is uploaded as the app-source-* artifact every child extracts --
          # one identical tree everywhere, no child clones, fingerprint patch in one
          # place. Nothing is pushed (GITHUB_TOKEN may never push commits touching
          # .github/workflows, which upstream history routinely does).
          if [ "$EXISTS" != "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git remote add upstream https://github.com/ggml-org/llama.cpp.git
            # Checking out the upstream base replaces this working tree with
            # upstream's, which has no scripts/unsloth/. Keep the resolver
            # somewhere the checkout cannot take away.
            ADDITIVE_MERGE="${RUNNER_TEMP}/additive_merge.py"
            cp scripts/unsloth/additive_merge.py "$ADDITIVE_MERGE"
            if [ "$(jq length <<<"$PRS")" != 0 ]; then
              # Merges need a merge-base, so unshallow first.
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                git fetch -q --unshallow --no-tags origin
              fi
              git fetch -q --no-tags upstream "refs/tags/${BASE}:refs/tags/${BASE}"
              git checkout -q --detach "refs/tags/${BASE}"
              # Each pin is fetched from the repo its PR lives in (repo/number/
              # sha are machine fields, so the space-delimited read is safe;
              # titles stay out of this loop).
              while read -r SRC NUM SHA; do
                # The PR's own repo first, then our refs/pins mirror, which is
                # the only copy left once an author force-pushes the reviewed
                # commit out of the PR. That is what took the nightly down on
                # 07-31, and it is unrecoverable without a ref of our own.
                git fetch -q --no-tags "https://github.com/${SRC}.git" "$SHA" 2>/dev/null \
                  || git fetch -q --no-tags origin "refs/pins/${SHA}" 2>/dev/null \
                  || { echo "could not fetch commit ${SHA} for ${SRC}#${NUM}; it is gone from ${SRC} and was never mirrored to refs/pins -- update or remove the pin in scripts/unsloth/pr-set.json" >&2; exit 1; }
                if ! git rev-parse --verify -q "${SHA}^{commit}" >/dev/null; then
                  echo "fetched something for ${SRC}#${NUM} but ${SHA} is still missing" >&2; exit 1
                fi
                # diff3 so additive_merge.py can see the merge base and refuse
                # anything that is not a pure add/add.
                if ! git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                       -c merge.conflictStyle=diff3 \
                       merge --no-ff --no-edit -m "Merge ${SRC}#${NUM} @ ${SHA}" "$SHA"; then
                  # The recurring conflict is two PRs adding a line to the same
                  # architecture table, where the answer is always "keep both".
                  # additive_merge.py resolves only that, and refuses when
                  # either side edited existing text, so a real disagreement
                  # still hard-fails here rather than being papered over.
                  if python3 "$ADDITIVE_MERGE" \
                       && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
                    git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                      commit -q --no-edit
                    echo "::warning::${SRC}#${NUM} needed an additive merge; every conflict was a pure add/add and both sides were kept"
                  else
                    git merge --abort 2>/dev/null
                    echo "${SRC}#${NUM} (${SHA}) does not merge cleanly onto ${BASE} + the PRs listed before it; reorder or drop it in scripts/unsloth/pr-set.json" >&2; exit 1
                  fi
                fi
              done < <(jq -r '.[] | "\(.repo) \(.number) \(.sha)"' <<<"$PRS")
            else
              # Plain build: only the base tree is needed. Shallow is fine -- the
              # build number is baked below, so no git history is needed at build time.
              git fetch -q --depth 1 --no-tags upstream "refs/tags/${BASE}:refs/tags/${BASE}"
              git checkout -q --detach "refs/tags/${BASE}"
            fi
            COMMIT="$(git rev-parse HEAD)"
            # ABI key for anything compiled against our ggml (whisper.cpp slim
            # bundles). The tree id changes only when ggml/ contents change, so
            # a release that touches nothing under ggml/ does not force a
            # rebuild downstream. The -mix- tag suffix is a hash of the PR set,
            # not a ggml identity: it stays constant while the base tag moves.
            GGML_TREE="$(git rev-parse HEAD:ggml)"
            GGML_VERSION="$(sed -nE 's/^set\(GGML_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)$/\2/p' ggml/CMakeLists.txt | paste -sd. -)"
            # Warn, do not fail: these only tighten downstream pairing, and
            # whisper falls back to the old comparison when they are absent.
            # Killing a 39-job release over a metadata field would be worse
            # than publishing without it.
            printf '%s' "$GGML_TREE" | grep -qE '^[0-9a-f]{40}$' \
              || { echo "::warning::could not resolve the ggml tree id"; GGML_TREE=""; }
            printf '%s' "$GGML_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::warning::could not parse GGML_VERSION from ggml/CMakeLists.txt"; GGML_VERSION=""; }
            echo "ggml tree ${GGML_TREE:-unknown} (version ${GGML_VERSION:-unknown})"

            # The tarball ships without .git, where cmake/build-info.cmake falls
            # back to its defaults; bake real values into those defaults so
            # llama-server --version doesn't report b0 (unknown). The build number
            # stays the BASE's b#### number (the upstream tag's commit count), so
            # anything comparing versions against upstream releases keeps working;
            # BUILD_COMMIT identifies the (possibly merged) head.
            COUNT="${BASE#b}"
            SHORT="$(git rev-parse --short HEAD)"
            sed -i "s/^set(BUILD_NUMBER 0)$/set(BUILD_NUMBER ${COUNT})/" cmake/build-info.cmake
            sed -i "s/^set(BUILD_COMMIT \"unknown\")$/set(BUILD_COMMIT \"${SHORT}\")/" cmake/build-info.cmake
            grep -q "set(BUILD_NUMBER ${COUNT})" cmake/build-info.cmake \
              && grep -q "set(BUILD_COMMIT \"${SHORT}\")" cmake/build-info.cmake \
              || { echo "cmake/build-info.cmake no longer has the expected fallback lines; cannot bake the build number into the source artifact" >&2; exit 1; }

            # Unsloth fingerprint: fold "Compiled by the Unsloth team"
            # into BUILD_TARGET, which cmake bakes into LLAMA_BUILD_TARGET, so it
            # prints on llama-server --version ("built with ... for ...") and shows
            # up in `strings` on every binary that links common. Append so it wraps
            # whatever BUILD_TARGET the build computes. Keep this string byte-identical
            # to MARK in the assemble job's verify gate, which re-checks it landed.
            grep -q 'set(BUILD_TARGET' cmake/build-info.cmake \
              || { echo "cmake/build-info.cmake has no BUILD_TARGET line to stamp" >&2; exit 1; }
            printf '\n# Unsloth fingerprint: shows in --version and strings.\nset(BUILD_TARGET "${BUILD_TARGET} (Compiled by the Unsloth team)")\n' >> cmake/build-info.cmake
            grep -q 'Compiled by the Unsloth team' cmake/build-info.cmake \
              || { echo "failed to stamp the Unsloth fingerprint into cmake/build-info.cmake" >&2; exit 1; }

            tar -czf "${RUNNER_TEMP}/llama.cpp-source-${TAG}.tar.gz" --exclude-vcs --transform "s,^\.,llama.cpp-${TAG}," .
            echo "prepared ${TAG} (${COMMIT}, build ${COUNT})"
          else
            echo "release ${TAG} already published; skipping source prep (nothing to build)"
          fi

          # ubuntu-22.04 is x64 (glibc 2.35). arm64 only has ubuntu-24.04-arm
          # available on GitHub-hosted runners (glibc 2.39). arm64 is cuda13-only
          # (no cuda12 SBSA) and ships the single "portable" coverage class.
          # cuda12 installs via Jimver; cuda13 is pinned to 13.3 (matching
          # upstream) which Jimver lacks, so those install via NVIDIA redist in
          # the build children -- on the same runners, so the glibc floor holds.
          ALL='[
            {"profile":"cuda12-legacy",  "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"legacy",  "rank":5, "cuda":"12.8.0","toolkit_line":"12.8","archs":"50-virtual 61-virtual","sms":"50 52 60 61"},
            {"profile":"cuda12-older",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"older",   "rank":10,"cuda":"12.8.0","toolkit_line":"12.8","archs":"70 75 80 86 89"},
            {"profile":"cuda12-newer",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"newer",   "rank":20,"cuda":"12.8.0","toolkit_line":"12.8","archs":"86 89 90 100 120"},
            {"profile":"cuda12-portable","arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda12","klass":"portable","rank":30,"cuda":"12.8.0","toolkit_line":"12.8","archs":"70 75 80 86 89 90 100 120"},
            {"profile":"cuda13-older",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda13","klass":"older",   "rank":40,"cuda":"13.3","toolkit_line":"13.3","archs":"75 80 86 89"},
            {"profile":"cuda13-newer",   "arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda13","klass":"newer",   "rank":50,"cuda":"13.3","toolkit_line":"13.3","archs":"86 89 90 100 120"},
            {"profile":"cuda13-portable","arch":"x64",  "runner":"ubuntu-22.04",    "line":"cuda13","klass":"portable","rank":60,"cuda":"13.3","toolkit_line":"13.3","archs":"75 80 86 89 90 100 120"},
            {"profile":"cuda13-portable","arch":"arm64","runner":"ubuntu-24.04-arm","line":"cuda13","klass":"portable","rank":60,"cuda":"13.3","toolkit_line":"13.3","archs":"90 100 120 121"}
          ]'
          if [ "$ONLY" = "all" ]; then
            CUDA_INCLUDE="$(echo "$ALL" | jq -c .)"
          else
            CUDA_INCLUDE="$(echo "$ALL" | jq -c --arg p "$ONLY" '[.[] | select(.profile==$p)]')"
          fi
          # CUDA Windows reuses the x64 profiles (same arch lists / CUDA
          # versions), just on a Windows runner. arm64 has no CUDA Windows target.
          WIN_CUDA_INCLUDE="$(echo "$CUDA_INCLUDE" | jq -c '[.[] | select(.arch=="x64") | .runner="windows-2022"]')"
          [ -n "$GFX" ] || { echo "refusing empty gfx_target (would publish a CUDA-only release labeled CUDA + ROCm)" >&2; exit 1; }
          ROCM_MATRIX="$(jq -cn --arg g "$GFX" '{gfx_target: ($g | split(",") | map(gsub("^\\s+|\\s+$"; "")))}')"

          # One weekly cutoff for the whole run, before fan-out.
          # Each leg reads its own clock otherwise, so a run crossing the SF Sat-to-Sun boundary would mix two toolchains in one release.
          ROCM_CUTOFF="$(TZ=America/Los_Angeles date -d "-$(TZ=America/Los_Angeles date +%w) days" +%Y%m%d)"

          # macOS slices are static: two fixed runners with per-slice deployment
          # targets. arm64 builds on macos-26 (newest Metal SDK; avoids the
          # M5/A19 "error compiling source" the macos-14 SDK emits) while both
          # slices pin 13.3 to match upstream's Ventura compatibility floor.
          MACOS_INCLUDE='[
            {"build":"arm64","runner":"macos-26",      "expect_arch":"arm64", "deploy_target":"13.3","defines":"-DGGML_METAL_EMBED_LIBRARY=ON"},
            {"build":"x64",  "runner":"macos-15-intel","expect_arch":"x86_64","deploy_target":"13.3","defines":"-DGGML_METAL=OFF"}
          ]'
          MACOS_INCLUDE="$(echo "$MACOS_INCLUDE" | jq -c .)"

          {
            echo "tag=$TAG"
            echo "repo=$REPO"
            echo "base=$BASE"
            echo "prs=$PRS"
            echo "source_artifact=$SRC_ARTIFACT"
            echo "commit=$COMMIT"
            echo "ggml_tree=$GGML_TREE"
            echo "ggml_version=$GGML_VERSION"
            echo "exists=$EXISTS"
            echo "cuda_matrix={\"include\":$CUDA_INCLUDE}"
            echo "win_cuda_matrix={\"include\":$WIN_CUDA_INCLUDE}"
            echo "rocm_matrix=$ROCM_MATRIX"
            echo "rocm_cutoff=$ROCM_CUTOFF"
            echo "macos_matrix={\"include\":$MACOS_INCLUDE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $REQ -> $TAG ($COMMIT); prs=$PRS; source_artifact=${SRC_ARTIFACT:-none}; release exists=$EXISTS; only=$ONLY; gfx=$GFX"

      # The stamped source tree (every build): every build child extracts this
      # instead of cloning, and assemble ships it as the release's source-tarball
      # asset, so a source build reproduces the same fingerprinted binary. Only
      # produced when we build, so guard on the same condition as the build jobs
      # (resolve skips source prep on a scheduled no-op, leaving no tarball).
      - name: Upload source artifact
        if: ${{ steps.r.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.r.outputs.source_artifact }}
          path: ${{ runner.temp }}/llama.cpp-source-${{ steps.r.outputs.tag }}.tar.gz
          if-no-files-found: error
          retention-days: 7

      # Ask unsloth to stand its scheduled CI down while this release builds.
      # Fired here rather than at assemble time: the point is to free slots
      # before the 39-job matrix queues, not after it has finished waiting.
      # Guarded on the same condition as the build jobs, so a scheduled no-op
      # never sweeps anything.
      #
      # workflow_dispatch, not repository_dispatch. Both would work, but
      # POST /dispatches needs Contents: write on the target and this needs only
      # Actions: write, so the token cannot push code to unsloth.
      #
      # unsloth decides what it is willing to cancel; this only asks. If the
      # sweeper is not on unsloth's main yet, this 404s and warns, which is why
      # the whole step is best-effort.
      - name: Ask unsloth to free runner capacity
        if: ${{ steps.r.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
        # A release must never fail because the request did not land.
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.UNSLOTH_DISPATCH_TOKEN }}
          TAG: ${{ steps.r.outputs.tag }}
        run: |
          # No -x here: it would trace the token into the log.
          set -eu
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning::UNSLOTH_DISPATCH_TOKEN is not set; not asking unsloth to free capacity"
            exit 0
          fi
          PAYLOAD="$(jq -cn --arg r "llama.cpp ${TAG} run ${GITHUB_RUN_ID}" \
            '{ref: "main", inputs: {mode: "sweep", events: "schedule", classes: "linux,windows", reason: $r}}')"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/unslothai/unsloth/actions/workflows/ci-capacity.yml/dispatches \
            -d "$PAYLOAD")"
          # 204 is "request accepted", not "capacity freed". unsloth's sweeper
          # ships inert, so until it is enabled there this is a no-op by design.
          if [ "$CODE" = "204" ]; then
            echo "asked unsloth to free linux/windows capacity for ${TAG}"
          else
            echo "::warning::unsloth ci-capacity dispatch returned HTTP ${CODE}; continuing without it"
          fi

  build-cuda:
    name: CUDA
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/unsloth-prebuilt-cuda.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      repo: ${{ needs.resolve.outputs.repo }}
      source_artifact: ${{ needs.resolve.outputs.source_artifact }}
      commit: ${{ needs.resolve.outputs.commit }}
      matrix: ${{ needs.resolve.outputs.cuda_matrix }}

  build-windows-cuda:
    name: CUDA Windows
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/unsloth-prebuilt-cuda-windows.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      repo: ${{ needs.resolve.outputs.repo }}
      source_artifact: ${{ needs.resolve.outputs.source_artifact }}
      commit: ${{ needs.resolve.outputs.commit }}
      matrix: ${{ needs.resolve.outputs.win_cuda_matrix }}

  build-rocm:
    name: ROCm
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/unsloth-prebuilt-rocm.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      repo: ${{ needs.resolve.outputs.repo }}
      source_artifact: ${{ needs.resolve.outputs.source_artifact }}
      matrix: ${{ needs.resolve.outputs.rocm_matrix }}
      operating_systems: ${{ github.event.inputs.operating_systems || 'windows,ubuntu' }}
      rocm_version: ${{ github.event.inputs.rocm_version || 'weekly' }}
      rocm_cutoff: ${{ needs.resolve.outputs.rocm_cutoff }}

  build-macos:
    name: macOS
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/unsloth-prebuilt-macos.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      repo: ${{ needs.resolve.outputs.repo }}
      source_artifact: ${{ needs.resolve.outputs.source_artifact }}
      matrix: ${{ needs.resolve.outputs.macos_matrix }}

  build-cpu:
    name: CPU
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/unsloth-prebuilt-cpu.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      repo: ${{ needs.resolve.outputs.repo }}
      source_artifact: ${{ needs.resolve.outputs.source_artifact }}

  build-vulkan:
    name: Vulkan
    needs: resolve
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/unsloth-prebuilt-vulkan.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      repo: ${{ needs.resolve.outputs.repo }}
      source_artifact: ${{ needs.resolve.outputs.source_artifact }}

  assemble:
    name: Assemble metadata + publish
    # Only `resolve`, so this job starts alongside the build matrix instead of
    # after it. It used to `needs:` every build child, which meant it began
    # queueing for a runner only once the last leg went green: on the reference
    # run that queue wait was 109 minutes to then run a 10-second job. Starting
    # early overlaps the wait with the build. The cost is one runner slot held
    # for the length of the run.
    needs: [resolve]
    # No `if: always()`. Atomicity is unchanged in effect, but it is now
    # enforced by the "Wait for the build matrix" step below rather than by
    # `needs:`: that step blocks until every sibling build job is finished and
    # exits non-zero unless all of them succeeded, so a failed leg still
    # publishes nothing. The installer needs the full bundle set or it'll fail.
    if: ${{ needs.resolve.outputs.exists != 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    # Consumed by the reclaim job below: 'true' only when THIS run's publish
    # step actually ran and succeeded.
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
    # The waiter holds this job open for the whole build. GitHub's 6h job cap
    # would kill it with no useful message; stop short of that deliberately,
    # leaving room for the download/verify/publish steps that follow.
    timeout-minutes: 350
    # A job-level block replaces the workflow-level one, so contents:write has
    # to be repeated here; actions:read is what lets the waiter read the run's
    # job list (the `alert` job already needs it for the same reason).
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Reimplements the `needs:` success check that the trimmed-down `needs:`
      # above gave away. It has to be at least as strict as `needs:` was --
      # publishing a partial release is far worse than publishing late.
      - name: Wait for the build matrix
        env:
          # Same expression that gates the verify/publish steps below.
          PUBLISH_INTENT: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          set -euo pipefail

          # Build jobs live in called workflows, so they appear in this run's
          # job list as "<caller job name> / <called job name>", e.g.
          # "CUDA / x64/cuda12-legacy". One prefix per build child; every one of
          # them must be represented or we are not looking at a complete run.
          PREFIXES=('CUDA / ' 'CUDA Windows / ' 'ROCm / ' 'macOS / ' 'CPU / ' 'Vulkan / ')
          SELF='Assemble metadata + publish'
          ALERT='Report pipeline health'

          POLL=60
          DEADLINE=$(( $(date +%s) + 330 * 60 ))
          # Called-workflow job records do not all exist the moment the run
          # starts, so a missing prefix is only fatal once this has passed.
          STARTUP_DEADLINE=$(( $(date +%s) + 45 * 60 ))
          API_FAILS=0

          while :; do
            if ! JOBS="$(gh api --paginate \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
                  --jq '.jobs[] | [.name, .status, (.conclusion // "none")] | @tsv' 2>/dev/null)"; then
              # A blip in the jobs API must not throw away a finished build.
              API_FAILS=$(( API_FAILS + 1 ))
              if [ "$API_FAILS" -ge 10 ]; then
                echo "ERROR: the jobs API failed 10 times running; cannot confirm the build matrix finished" >&2
                exit 1
              fi
              echo "jobs API call failed (${API_FAILS}/10); retrying in ${POLL}s"
              sleep "$POLL"
              continue
            fi
            API_FAILS=0

            # Everything in the run except this job and the alert job that
            # reports on it. `resolve` stays in the set; it is already a
            # `needs:`, so it is a free consistency check.
            SIBS="$(printf '%s\n' "$JOBS" | awk -F'\t' -v self="$SELF" -v alert="$ALERT" 'NF && $1 != self && $1 != alert')"

            MISSING=""
            for p in "${PREFIXES[@]}"; do
              printf '%s\n' "$SIBS" | awk -F'\t' -v p="$p" 'index($1, p) == 1 { found = 1 } END { exit !found }' \
                || MISSING="${MISSING} '${p}'"
            done
            if [ -n "$MISSING" ]; then
              if [ "$(date +%s)" -gt "$STARTUP_DEADLINE" ]; then
                echo "ERROR: no job records for build child(ren):${MISSING}; refusing to publish without confirming they ran" >&2
                exit 1
              fi
              echo "waiting for job records to appear for:${MISSING}"
              sleep "$POLL"
              continue
            fi

            # Fail on the first finished leg that did not succeed rather than
            # sitting on a runner for another hour to reach the same answer.
            # `skipped` is the one conclusion that needs a judgement call: a
            # publish run is pinned by `resolve` to the full default matrix, so
            # a skipped leg there means something is wrong and must block, but a
            # publish=false subset dispatch (say operating_systems=ubuntu) skips
            # legs on purpose and `needs:` tolerated that before.
            BAD="$(printf '%s\n' "$SIBS" | awk -F'\t' -v strict="$PUBLISH_INTENT" '
              !NF || $2 != "completed" { next }
              $3 == "success" { next }
              $3 == "skipped" && strict != "true" { next }
              { printf "  %s (%s)\n", $1, $3 }
            ')"
            if [ -n "$BAD" ]; then
              echo "ERROR: refusing to publish, these build jobs did not succeed:" >&2
              printf '%s\n' "$BAD" >&2
              exit 1
            fi

            TOTAL="$(printf '%s\n' "$SIBS" | grep -c . || true)"
            PENDING="$(printf '%s\n' "$SIBS" | awk -F'\t' 'NF && $2 != "completed"' | grep -c . || true)"
            if [ "$PENDING" -eq 0 ]; then
              echo "all ${TOTAL} build jobs finished and succeeded"
              break
            fi
            if [ "$(date +%s)" -gt "$DEADLINE" ]; then
              echo "ERROR: timed out waiting for the build matrix; ${PENDING} of ${TOTAL} jobs still running" >&2
              exit 1
            fi
            echo "${PENDING} of ${TOTAL} build jobs still running; polling again in ${POLL}s"
            sleep "$POLL"
          done

      - name: Checkout build tooling (this repo)
        uses: actions/checkout@v6
        with:
          path: tooling

      # The first download attempt occasionally hits a transient ECONNRESET
      # on GitHub's ListArtifacts API. Retrying once is cheaper than
      # re-running the whole hour-long build matrix.
      - name: Download built bundles
        id: download
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          path: dist
          pattern: app-*
          merge-multiple: true

      - name: Download built bundles (retry)
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: app-*
          merge-multiple: true

      # Fingerprint gate: every bundle must carry the fingerprint the build children
      # fold into BUILD_TARGET (-> LLAMA_BUILD_TARGET, printed by `--version`). That
      # string is compiled into common (build-info.cpp); on Linux/macOS it lands in
      # llama-server's own .rodata, but on a Windows shared build it can live in the
      # sibling llama-common DLL instead -- so scan every file in the bundle, not
      # just the exe. Nothing but a compiled binary carries this string (no metadata
      # file does), so a hit means the brand shipped. Scan bytes rather than running
      # `--version`: cross-compiled (ROCm) and Windows binaries can't run on this
      # Linux runner. MARK must stay byte-identical to the resolve job's stamp string.
      # Refuse to publish if any bundle is unbranded.
      - name: Verify Unsloth fingerprint in every bundle
        run: |
          set -euo pipefail
          MARK='Compiled by the Unsloth team'
          shopt -s nullglob
          tmp="$(mktemp -d)"
          fail=0
          checked=0
          for arc in dist/app-*.tar.gz dist/app-*.zip dist/llama-*-bin-macos-*.tar.gz; do
            d="$tmp/extract"
            rm -rf "$d"; mkdir -p "$d"
            case "$arc" in
              *.zip)    unzip -qo "$arc" -d "$d" ;;
              *.tar.gz) tar -xzf "$arc" -C "$d" ;;
            esac
            if grep -arq "$MARK" "$d"; then
              checked=$((checked + 1))
            else
              echo "ERROR: $(basename "$arc"): no file carries the Unsloth fingerprint" >&2; fail=1
            fi
          done
          rm -rf "$tmp"
          [ "$checked" -gt 0 ] || { echo "ERROR: no bundles found to verify (expected app-*/llama-*-bin-macos-* in dist/)" >&2; exit 1; }
          [ "$fail" = 0 ] || { echo "ERROR: refusing to publish unbranded binaries" >&2; exit 1; }
          echo "fingerprint verified in $checked bundles"

      # Ship the stamped source tree as release assets so the installer's
      # source-build fallback reproduces the same fingerprinted binary. The resolve
      # job's app-source-* artifact lands the tag-named tarball in dist/ (via the
      # app-* download above); copy it to the commit name too. Both are the exact
      # local bytes assemble_metadata hashes into the sha256 index.
      - name: Fetch source archives
        run: |
          set -eux
          TAG='${{ needs.resolve.outputs.tag }}'
          SHA='${{ needs.resolve.outputs.commit }}'
          cp "dist/llama.cpp-source-${TAG}.tar.gz" "dist/llama.cpp-source-commit-${SHA}.tar.gz"

      - name: Generate manifest + sha256 index
        # prs carries PR titles (arbitrary text), so pass it through env
        # rather than inlining it: a title with a quote would otherwise break out
        # of the shell command. Same handling in the publish step below.
        env:
          PRS_JSON: ${{ needs.resolve.outputs.prs }}
        run: |
          set -eux
          python3 tooling/scripts/unsloth/assemble_metadata.py \
            --tag '${{ needs.resolve.outputs.tag }}' \
            --source-repo '${{ needs.resolve.outputs.repo }}' \
            --base-tag '${{ needs.resolve.outputs.base }}' \
            --pr-set "$PRS_JSON" \
            --ggml-tree '${{ needs.resolve.outputs.ggml_tree }}' \
            --ggml-version '${{ needs.resolve.outputs.ggml_version }}' \
            --commit '${{ needs.resolve.outputs.commit }}' \
            --dist dist --out dist \
            --publish-repo "$GITHUB_REPOSITORY"
          ls -la dist

      - name: Verify full bundle coverage before publish
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && needs.resolve.outputs.exists != 'true' }}
        run: |
          set -eu
          TAG='${{ needs.resolve.outputs.tag }}'
          fail=0
          # A partial CUDA set (cuda13 without cuda12) silently strands the
          # cuda12-runtime majority; require matching x64 coverage on both lines.
          # cuda12-legacy has no cuda13 sibling, so `-nE ... p` drops it from
          # this cross-line parity check; its presence is required separately below.
          for os in linux windows; do
            ext=$([ "$os" = windows ] && echo zip || echo tar.gz)
            c12=$(ls dist/app-*-"$os"-x64-cuda12-*."$ext" 2>/dev/null | sed -nE 's/.*cuda12-(older|newer|portable)\..*/\1/p' | sort -u | paste -sd, -)
            c13=$(ls dist/app-*-"$os"-x64-cuda13-*."$ext" 2>/dev/null | sed -nE 's/.*cuda13-(older|newer|portable)\..*/\1/p' | sort -u | paste -sd, -)
            echo "$os x64 coverage: cuda12=[$c12] cuda13=[$c13]"
            [ -n "$c12" ] && [ "$c12" = "$c13" ] || { echo "ERROR: $os x64 cuda12/cuda13 coverage mismatch" >&2; fail=1; }
          done
          # Children passing is not the same as files landing in dist/ (a
          # download-artifact anomaly leaves green jobs and missing bundles),
          # so assert presence of every line not covered by the parity check
          # above (the non-CUDA-x64 lines, plus cuda12-legacy). The resolve-time
          # input guard already pins publish runs to the full default matrix, so
          # these names are exact.
          for f in \
            "app-${TAG}-linux-x64-cuda12-legacy.tar.gz" \
            "app-${TAG}-windows-x64-cuda12-legacy.zip" \
            "llama-${TAG}-bin-macos-arm64.tar.gz" \
            "llama-${TAG}-bin-macos-x64.tar.gz" \
            "app-${TAG}-linux-arm64-cuda13-portable.tar.gz" \
            "app-${TAG}-linux-x64-cpu.tar.gz" \
            "app-${TAG}-windows-x64-cpu.zip" \
            "app-${TAG}-linux-arm64-cpu.tar.gz" \
            "app-${TAG}-windows-arm64-cpu.zip" \
            "app-${TAG}-linux-x64-vulkan.tar.gz" \
            "app-${TAG}-linux-arm64-vulkan.tar.gz" \
            "app-${TAG}-windows-x64-vulkan.zip"; do
            [ -s "dist/$f" ] || { echo "ERROR: missing $f in dist/" >&2; fail=1; }
          done
          # Default ROCm set (mirrors the gfx_target input default): both OSes
          # per family, or AMD hosts of that family silently lose their bundle.
          for gfx in gfx1151 gfx1150 gfx120X gfx110X gfx103X gfx90a gfx908; do
            [ -s "dist/app-${TAG}-linux-x64-rocm-${gfx}.tar.gz" ] || { echo "ERROR: missing linux rocm ${gfx} bundle in dist/" >&2; fail=1; }
            [ -s "dist/app-${TAG}-windows-x64-rocm-${gfx}.zip" ]  || { echo "ERROR: missing windows rocm ${gfx} bundle in dist/" >&2; fail=1; }
          done
          [ "$fail" = 0 ] || { echo "ERROR: refusing to publish a partial release" >&2; exit 1; }

      - name: Publish GitHub release
        id: publish
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && needs.resolve.outputs.exists != 'true' }}
        # prs carries PR titles (arbitrary text), so pass it through env
        # rather than inlining it: a title with a quote would otherwise break out
        # of the shell command.
        env:
          PRS_JSON: ${{ needs.resolve.outputs.prs }}
        run: |
          set -eux
          TAG='${{ needs.resolve.outputs.tag }}'
          REPO="$GITHUB_REPOSITORY"
          PRS="$PRS_JSON"
          BASE='${{ needs.resolve.outputs.base }}'
          # Link the base to the upstream release tag (always resolves). Each PR
          # line is "<title> (#<n>, commit <sha>)": GitHub does not expand a bare
          # reference into the PR title inline (only on hover), so we bake the
          # title in ourselves. #<n> links to the PR in its home repo (full URL,
          # so it resolves no matter which repo hosts the release, and GitHub
          # still attaches its hovercard); non-upstream PRs spell the repo in
          # the link text so an unslothai pin can't read as an upstream one.
          # <sha> links to that pin's commit-in-PR URL. We deliberately do not
          # link the merged commit: in mix mode it is a throwaway merge made on
          # the runner and never pushed anywhere, so any repo@sha URL for it 404s.
          NOTES="Automated Unsloth llama.cpp CUDA + ROCm + Vulkan + macOS + CPU prebuild for upstream [${BASE}](https://github.com/ggml-org/llama.cpp/releases/tag/${BASE})"
          if [ "$(jq length <<<"$PRS")" = 0 ]; then
            NOTES="${NOTES}."
          else
            PR_LIST="$(jq -r 'map("- \(.title) ([\(if .repo == "ggml-org/llama.cpp" then "" else .repo end)#\(.number)](https://github.com/\(.repo)/pull/\(.number)), commit [\(.sha[0:7])](\(.url)))") | join("\n")' <<<"$PRS")"
            NOTES="$(printf '%s, merged with:\n\n%s' "$NOTES" "$PR_LIST")"
          fi

          # Atomic publish: upload as draft (hidden from the anon GitHub API
          # the installer uses), then flip draft=false only once every asset
          # landed. Leftover drafts from failed runs are detected as "not
          # exists" by resolve and rebuilt on the next run.
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || true)" = "true" ]; then
            gh release delete "$TAG" --repo "$REPO" --yes
          fi
          gh release create "$TAG" --repo "$REPO" --draft \
            --title "llama.cpp prebuilt $TAG" \
            --notes "$NOTES" \
            dist/*
          gh release edit "$TAG" --repo "$REPO" --draft=false

      # Debug fallback for a failed publish. This used to upload on EVERY run,
      # ahead of the publish gate, which cost ~688 MiB of Actions artifact
      # storage per run for a bundle nothing reads: no download-artifact in this
      # repo references it, an org-wide code search for `actions/artifacts`
      # returns nothing, and Studio's installer resolves release ASSETS
      # (install_llama_prebuilt.py -> release_asset_download_url). Uploading
      # ahead of the gate also published unverified builds -- on a public repo
      # any signed-in user can download an artifact -- for runs that
      # deliberately never released.
      #
      # Kept but moved after publish and gated on failure(), so it still rescues
      # a failed-publish run without re-running the 40-job matrix, and costs
      # nothing when the run is green.
      - name: Upload full release set (artifacts)
        # always() && !success(), not failure(): a cancelled assemble -- its own
        # timeout, or a superseding nightly -- is not on the failure path, so
        # failure() would skip the rescue bundle on exactly the runs a human
        # most wants it for. Nothing else in this job competes for the teardown
        # window, so attempting the upload there is free; if dist/ was never
        # populated, if-no-files-found: warn keeps that quiet.
        if: ${{ always() && !success() }}
        uses: actions/upload-artifact@v6
        with:
          name: unsloth-prebuilt-${{ needs.resolve.outputs.tag }}
          path: dist/*
          # warn, not error: an early failure can leave dist/ absent, and a
          # missing debug bundle must not turn a diagnosable failure into a
          # confusing second one.
          if-no-files-found: warn
          # rerun-failed-jobs reuses the run id, and artifacts persist across
          # attempts, so a second failed attempt would 409 on the duplicate name.
          overwrite: true
          retention-days: 7

      # whisper.cpp slim bundles are compiled against this release's ggml and
      # ship no libggml*, so a new ggml means whisper has to republish. Without
      # this it only finds out on its own cron, and Studio reports "no
      # compatible prebuilt" until then.
      - name: Notify whisper.cpp
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && needs.resolve.outputs.exists != 'true' }}
        # Never fail a published release because the notification did not land.
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.WHISPER_DISPATCH_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          GGML_TREE: ${{ needs.resolve.outputs.ggml_tree }}
        run: |
          # No -x here: it would trace the token into the log.
          set -eu
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning::WHISPER_DISPATCH_TOKEN is not set; whisper.cpp will only pick this up on its own schedule"
            exit 0
          fi
          PAYLOAD="$(jq -cn --arg t "$TAG" --arg g "$GGML_TREE" --arg r "$GITHUB_RUN_ID" \
            '{event_type: "llama-published", client_payload: {llama_tag: $t, ggml_tree: $g, run_id: $r}}')"
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/unslothai/whisper.cpp/dispatches \
            -d "$PAYLOAD")"
          # 204 is "event accepted", not "whisper republished". The dead-man
          # check is what catches a dropped or ignored event.
          if [ "$CODE" = "204" ]; then
            echo "notified whisper.cpp of ${TAG}"
          else
            echo "::warning::whisper.cpp dispatch returned HTTP ${CODE}; it will fall back to its own schedule"
          fi

  # Reclaim this run's Actions artifact storage once the release is canonical.
  #
  # Every prebuilt is stored TWICE: as an Actions artifact (billed against the
  # Actions storage quota) and as a release asset (not billed against it).
  # Measured on run 31218133438: 36 of its 40 artifacts, 7.67 GiB, are byte-for
  # -byte already on the release. On 2026-08-07 that duplication reached ~492
  # GiB org-wide, 449 GiB of it here, and GitHub stopped scheduling Actions runs
  # across unslothai/* while personal-account repos ran the same workflows
  # normally. Deleting artifacts restored scheduling within ~45 seconds.
  #
  # Its OWN job rather than a step of assemble, for two reasons:
  #
  #  * Cancellation. As a trailing step, a cancel landing inside its ~13 second
  #    window left assemble `cancelled` with a partial app-* set, and
  #    unsloth-prebuilt-retry.yml reruns a cancelled run that has no failed job
  #    -- rerunning assemble itself, which then restarts at "Download built
  #    bundles", dies at the coverage gate, and reports "Nothing was published"
  #    for a release that HAD published. As a separate job, assemble has already
  #    succeeded, so a rerun re-runs only this job, and re-running it is a no-op:
  #    deleted artifacts are simply absent from the second listing.
  #  * Least privilege. `actions: write` also grants Actions CACHE deletion, so
  #    holding it across assemble's unzip/tar/python steps would put every
  #    ccache this pipeline depends on within reach of that job. Here it is
  #    confined to a job whose only action is deleting artifacts.
  #
  # Skipped, not failed, when there is nothing to reclaim: `needs.assemble
  # .outputs.published` is 'true' only when THIS run's publish step ran and
  # succeeded, so a dispatch that skips publishing (publish:false, or the tag
  # already released) never reaches the delete -- its artifacts would otherwise
  # be name-matched against a DIFFERENT build's release assets, since artifact
  # names are keyed only on the tag.
  #
  # Residual, accepted: `published` proves THIS run's publish step succeeded, not
  # that the release object is this run's. A scheduled run and a same-tag
  # dispatch sit in different concurrency groups, so a dispatch can delete the
  # scheduled run's draft and create its own; the scheduled run's
  # `gh release edit --draft=false` then succeeds against the dispatch's release.
  # The payloads are equivalent -- the resolve guard pins every publish run to
  # the full default matrix, and the tag encodes base plus pr-set hash -- so the
  # assets match whichever run wrote them.
  reclaim:
    name: Reclaim artifact storage
    needs: [resolve, assemble]
    if: ${{ needs.assemble.outputs.published == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write   # delete this run's artifacts
      contents: read   # read the release asset list
    steps:
      - name: Delete artifacts already published as release assets
        # Never fail a published release over cleanup.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          if [ -z "${TAG:-}" ]; then
            echo "no tag resolved; leaving artifacts untouched"
            exit 0
          fi

          # Gate 1: the release must exist and be published, not a draft.
          draft="$(gh release view "$TAG" --repo "$repo" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          if [ "$draft" != "false" ]; then
            echo "release $TAG is '$draft', not a published release; leaving artifacts untouched"
            exit 0
          fi
          assets="$RUNNER_TEMP/reclaim-assets.txt"
          arts="$RUNNER_TEMP/reclaim-arts.tsv"
          gh release view "$TAG" --repo "$repo" --json assets -q '.assets[].name' | sort > "$assets"
          echo "release $TAG has $(wc -l < "$assets") assets"

          # Gate 2: only THIS run's artifacts are even considered, so the step
          # cannot reach another run's -- including a concurrent build's.
          gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            -q '.artifacts[] | select(.expired==false) | "\(.id)\t\(.size_in_bytes)\t\(.name)"' > "$arts" || true
          echo "this run has $(grep -c . "$arts" || true) live artifacts"

          freed=0; deleted=0; kept=0; failed=0
          while IFS="$(printf '\t')" read -r id size name; do
            [ -z "${id:-}" ] && continue
            # Gate 3: delete only what is provably already on the release.
            # Build children upload `app-<tag>-<platform>`; assemble publishes
            # it as `.tar.gz` (linux/macos) or `.zip` (windows). Anything that
            # does not match is KEPT -- that is what protects a partial publish.
            # By design this also keeps the macOS bundles (published under
            # `llama-<tag>-bin-macos-*`) and the source tarball: 56 MiB of the
            # 7.42 GiB, a cheap price for never deleting something early.
            # -F: fixed string. Without it every `.` in the name is a regex
            # wildcard, and gfx_target / only_profile are free-text
            # workflow_dispatch inputs that flow into artifact names.
            if grep -qxF -- "${name}.tar.gz" "$assets" || grep -qxF -- "${name}.zip" "$assets"; then
              # < /dev/null so the command can never consume the loop's stdin
              # and silently truncate the sweep to one artifact.
              if err="$(gh api -X DELETE "repos/$repo/actions/artifacts/$id" --silent < /dev/null 2>&1)"; then
                freed=$(( freed + size )); deleted=$(( deleted + 1 ))
              else
                # Keep the reason: a 403 from a permissions regression and a
                # transient blip need different responses, and this step is
                # continue-on-error so nothing else surfaces it.
                printf '  could not delete %s: %s\n' "$name" "$err"
                failed=$(( failed + 1 ))
              fi
            else
              printf '  KEEP %s (no matching release asset)\n' "$name"
              kept=$(( kept + 1 ))
            fi
          done < "$arts"

          echo "deleted $deleted artifacts, freed $(( freed / 1048576 )) MiB, kept $kept, failed $failed"
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed artifact(s) could not be deleted; storage will be reclaimed by retention instead"
          fi
          {
            echo "### Artifact storage reclaimed"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| release | \`$TAG\` |"
            echo "| artifacts deleted | $deleted |"
            echo "| storage freed | $(( freed / 1048576 )) MiB |"
            echo "| kept (no release asset) | $kept |"
            echo "| delete failures | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Keep the ccache budget inside the repo limit ──
      #
      # ccache entries are immutable, so every run writes a NEW cache per
      # (cuda, os, profile) and finds the previous one by restore-keys prefix.
      # restore-keys returns only the MOST RECENT match, so older generations can
      # never be selected again -- they are pure landfill. Measured 2026-08-08:
      # 122 caches / 31.72 GiB, of which only 40 / 9.13 GiB were reachable.
      #
      # That matters for build time, not tidiness. The repo cache limit is 50 GB
      # and there are ~40 prefixes; once the total hits the limit GitHub evicts by
      # its own LRU, which can take a LIVE cache. A partial cache is far worse
      # than none: measured locally over 513 real translation units, capping a
      # cache to 30% of what the build needs drops the hit rate to 14.2% and
      # flips hits from direct to preprocessed -- the exact 3-direct /
      # 52-preprocessed signature seen in CI when the cap was 500 MB, which cost
      # a 204-minute build instead of 54.
      #
      # Keeping 2 rather than 1: the second generation is the fallback when a job
      # dies before saving, which is precisely the hole that forces a cold build.
      - name: Prune superseded ccache generations
        # Never fail a published release over cache housekeeping.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 2
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          all="$RUNNER_TEMP/caches.tsv"
          gh api --paginate "repos/$repo/actions/caches?per_page=100" \
            -q '.actions_caches[] | "\(.id)\t\(.created_at)\t\(.size_in_bytes)\t\(.key)"' > "$all" || true
          total=$(awk -F'\t' '{s+=$3} END {printf "%d", s+0}' "$all")
          echo "$(grep -c . "$all" || true) caches, $(( total / 1073741824 )) GiB"

          # Group by the restore-keys prefix: the key minus its -<tag>- suffix.
          # Newest first, so anything past $KEEP is unreachable by restore-keys.
          # The ROCm version comes off too, else every weekly toolchain becomes its own group and keeps 2 caches that can never hit again.
          freed=0; deleted=0
          while IFS=$'\t' read -r id created size key; do
            [ -z "${id:-}" ] && continue
            pre="$(printf '%s' "$key" | sed -E 's/-b[0-9]+-mix-[0-9a-f]+-?$//; s/-[0-9]+\.[0-9]+\.[0-9]+(a|rc)[0-9]+$//')"
            printf '%s\t%s\t%s\t%s\n' "$pre" "$created" "$id" "$size"
          done < "$all" | sort -t"$(printf '\t')" -k1,1 -k2,2r > "$RUNNER_TEMP/grouped.tsv"

          prev=""; n=0
          while IFS=$'\t' read -r pre created id size; do
            [ -z "${pre:-}" ] && continue
            if [ "$pre" != "$prev" ]; then prev="$pre"; n=1; else n=$(( n + 1 )); fi
            [ "$n" -le "$KEEP" ] && continue
            if gh api -X DELETE "repos/$repo/actions/caches/$id" --silent < /dev/null 2>/dev/null; then
              freed=$(( freed + size )); deleted=$(( deleted + 1 ))
            fi
          done < "$RUNNER_TEMP/grouped.tsv"

          after=$(( total - freed ))
          echo "pruned $deleted superseded caches, freed $(( freed / 1073741824 )) GiB"
          {
            echo "### ccache budget"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| kept per prefix | $KEEP |"
            echo "| caches pruned | $deleted |"
            echo "| freed | $(( freed / 1073741824 )) GiB |"
            echo "| cache total after | $(( after / 1073741824 )) GiB of 50 GB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$after" -gt 42949672960 ]; then
            echo "::warning::ccache total is $(( after / 1073741824 )) GiB of the 50 GB repo limit; at the limit GitHub evicts by LRU and a partially evicted cache collapses the hit rate. Lower KEEP to 1, or raise the limit."
          fi

  # Without this a failed scheduled run is silent: GitHub emails only whoever
  # last touched the cron file, which is how three nightlies failed unnoticed.
  # Runs on publish-intent runs only, so subset test dispatches stay quiet.
  alert:
    name: Report pipeline health
    needs: [resolve, build-cuda, build-windows-cuda, build-rocm, build-macos, build-cpu, build-vulkan, assemble]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout (for the composite action)
        uses: actions/checkout@v6
        with: { persist-credentials: false }

      - name: Summarise run
        id: s
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          # 'skipped' is healthy: a scheduled no-op skips every build job.
          # 'cancelled' is not. On 08-05 every build passed and the publish job
          # was cancelled 15s in by something outside the run, so nothing was
          # released and this reported success: the silent no-publish we exist
          # to catch. Anything that is not success or skipped counts.
          FAILED="$(jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))") | join(", ")' <<<"$NEEDS_JSON")"
          if [ -z "$FAILED" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "details=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=failure" >> "$GITHUB_OUTPUT"

          # Quote the actual refusal so the issue says why, not just that a job failed.
          REASON="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
            | grep -aE 'refusing |does not merge cleanly onto |could not fetch commit |ERROR: ' \
            | sed -E 's/^[0-9-]+T[0-9:.]+Z //' | cut -c1-300 | head -5 || true)"

          {
            echo 'details<<ALERT_EOF'
            echo "**Failed jobs:** ${FAILED}"
            if [ -n "$REASON" ]; then
              echo
              echo 'Reported reason:'
              echo
              echo '```'
              echo "$REASON"
              echo '```'
            fi
            echo
            echo "Nothing was published; the previous release remains \`Latest\`."
            echo 'ALERT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert
        uses: ./.github/actions/prebuilt-alert
        with:
          status: ${{ steps.s.outputs.status }}
          key: llama-prebuilt-nightly
          title: 'Nightly llama.cpp prebuilt is failing'
          details: ${{ steps.s.outputs.details }}
          token: ${{ github.token }}
