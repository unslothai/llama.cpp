name: "Unsloth prebuilt: CPU"

# Reusable child of unsloth-prebuilt.yml. Builds the CPU-only bundles for Linux + Windows on x64
# and arm64, plus the Linux Vulkan bundles (each Linux job builds CPU, then Vulkan on the same
# runner). Every bundle is one app-*.{tar.gz|zip} artifact for assemble.
#
# The Linux build mirrors oobabooga/llama-cpp-binaries' build-wheels-cpu.yml
# (GGML_BACKEND_DL + GGML_CPU_ALL_VARIANTS + GGML_RPC, no GPU backend). The
# Windows build instead matches ggml-org/llama.cpp release.yml's windows-cpu
# job (clang/LLVM toolchain file + "Ninja Multi-Config" + OpenMP + BoringSSL,
# arm64 cross-compiled from x64) -- clang is upstream's proven CPU path, so we
# follow it rather than llama-cpp-binaries' MSVC recipe; MSVC stays only where
# it is mandatory (CUDA/nvcc). Adapted to this repo's conventions:
# app-<tag>-<platform>-<arch>-cpu archives packaged straight from build/bin like
# the ROCm/macOS children (no embedded UNSLOTH_PREBUILT_INFO.json --
# assemble_metadata.py derives the manifest entry from the filename), $ORIGIN
# RPATH on Linux. arm64 extends llama-cpp-binaries (x64-only) so the release
# covers the arm64 CPU hosts that previously fell back to ggml-org upstream.
# Both Linux legs build on ubuntu-22.04 so the bundles keep a glibc 2.35 /
# GLIBCXX <= 3.4.30 floor and load on Ubuntu 22.04 and Debian 12 hosts.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Upstream llama.cpp release tag (b####), resolved by parent'
        required: true
        type: string
      repo:
        description: 'Source repo (owner/name): ggml-org/llama.cpp for plain builds, or this repo for mix tags'
        required: false
        default: 'ggml-org/llama.cpp'
        type: string
      source_artifact:
        description: 'Workflow artifact (app-source-*) holding the stamped source tree; set by resolve for every build'
        required: false
        default: ''
        type: string

    secrets:
      AZURE_CLIENT_ID:
        description: 'Azure Trusted Signing client id; empty on forks, which then build unsigned'
        required: false
      AZURE_CLIENT_SECRET:
        description: 'Azure Trusted Signing client secret'
        required: false
      AZURE_TENANT_ID:
        description: 'Azure Trusted Signing tenant id'
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        description: 'Azure Trusted Signing account name'
        required: false
      AZURE_CERTIFICATE_PROFILE_NAME:
        description: 'Azure Trusted Signing certificate profile name'
        required: false

permissions:
  contents: read

jobs:
  build-linux:
    name: linux/${{ matrix.arch }} + Vulkan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      # The parent's resolve job built the source tree (upstream base + any mix
      # PRs, with the build number/commit and Unsloth fingerprint baked
      # into cmake/build-info.cmake) and uploaded it as an artifact; extract it
      # instead of cloning -- no .git needed, the build number is already baked.
      - name: Download source @ ${{ inputs.tag }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: ${{ inputs.source_artifact }}
          path: srcpkg
      - name: Extract source
        shell: bash
        run: |
          set -eux
          mkdir -p src
          tar -xzf "srcpkg/llama.cpp-source-${{ inputs.tag }}.tar.gz" -C src --strip-components=1

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev ninja-build

      # arm64 builds on ubuntu-22.04-arm so the bundle keeps the x64 leg's
      # loader floor (a 24.04 build needs GLIBC_2.38 and fails to load on
      # Ubuntu 22.04 / Debian 12). Jammy's gcc can't target armv9.2-a+sme and
      # a PPA gcc would raise the libstdc++ floor back, so use clang, which
      # links against the system libstdc++.
      - name: Toolchain (clang 19 on arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -eux
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y libomp-19-dev
          {
            echo "CC=clang-19"
            echo "CXX=clang++-19"
          } >> "$GITHUB_ENV"

      - name: ccache
        # Best-effort; see the verification in Configure ccache below.
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: cpu-linux-${{ matrix.arch }}-${{ inputs.tag }}
          restore-keys: |
            cpu-linux-${{ matrix.arch }}
          append-timestamp: false
          variant: ccache
          # ccache 4.13 from the action's binary; apt on ubuntu-22.04 ships 4.5.1.
          install: binary
          max-size: 2G
          save: false

      - name: Configure ccache
        # The install step above is best-effort: on 09-18 its binary download returned 92 bytes
        # instead of a tarball and two healthy legs died on "tar: This does not look like a tar
        # archive". A cache accelerator must never fail a release build. So verify ccache
        # POSITIVELY here and, when it is missing or older than the options below require,
        # export an empty CCACHE_LAUNCHER so cmake builds this leg uncached instead of failing.
        # No apt fallback on purpose: ubuntu-22.04 ships 4.5.1, which rejects these options and
        # would quietly change cache semantics rather than announce itself.
        run: |
          set -uo pipefail
          need=4.10
          have="$(ccache --version 2>/dev/null | head -1 | awk '{print $3}')"
          if [ -n "$have" ] && [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ]; then
            ccache --set-config=compiler_check=content
            ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,pch_defines,locale
            ccache --set-config=compression_level=6
            echo "CCACHE_LAUNCHER=ccache" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::warning::ccache unusable (found '${have:-none}', need >= $need); building without a cache"
          echo "- ccache unusable (found \`${have:-none}\`); this leg built without a cache" >> "$GITHUB_STEP_SUMMARY"
          echo "CCACHE_LAUNCHER=" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: src
        run: |
          set -eux
          # Build recipe mirrors llama-cpp-binaries' CPU wheel (backend-DL +
          # all CPU variants + RPC, no GPU backend). RPATH=$ORIGIN so the
          # bundle's sibling .so files resolve from the binary's own directory.
          # LLAMA_FATAL_WARNINGS below is -Werror. The arm64 image compiles with
          # clang-19 against GCC 12's libstdc++, where std::stable_sort still
          # reaches the deprecated get_temporary_buffer; GCC buries that in a
          # system header, clang reports it at our instantiation. That failed
          # this leg on 08-27 over a deprecation in code we do not own, so that
          # one diagnostic is off. Every other warning stays fatal.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_RPC=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DCMAKE_CXX_FLAGS=-Wno-deprecated-declarations \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }}

      - name: Build
        working-directory: src
        run: |
          set -eux
          # Build the full tool + server set (no --target), matching the macOS
          # bins. Backend modules (CPU variants, RPC) build as ggml deps.
          cmake --build build --config Release -j "$(nproc)"
          strip build/bin/llama-* || true

      - name: Bundle OpenMP runtime (arm64)
        if: matrix.arch == 'arm64'
        run: cp /usr/lib/llvm-19/lib/libomp.so.5 src/build/bin/

      # DiffusionGemma binaries (example targets present only in #24423 mix
      # builds): best-effort, never fail the job. See the CUDA child for the
      # rationale. The bundle tars all of build/bin, so anything produced here
      # is shipped automatically.
      - name: Build DiffusionGemma binaries (best-effort; mix builds only)
        working-directory: src
        run: |
          set -u
          if [ ! -d examples/diffusion-gemma-server ]; then
            echo "no DiffusionGemma sources in this tree; skipping"
            exit 0
          fi
          cmake -S . -B build -DLLAMA_BUILD_EXAMPLES=ON \
            || { echo "reconfigure for examples failed; skipping DiffusionGemma binaries"; exit 0; }
          if cmake --build build --config Release -j "$(nproc)" \
              --target llama-diffusion-gemma-visual-server llama-diffusion-cli; then
            strip build/bin/llama-diffusion-gemma-visual-server build/bin/llama-diffusion-cli || true
            echo "built DiffusionGemma binaries"
          else
            echo "warning: DiffusionGemma binaries failed to build; bundle will omit them"
          fi
          exit 0

      - name: Package bundle (tar.gz)
        run: |
          set -eux
          ASSET="app-${{ inputs.tag }}-linux-${{ matrix.arch }}-cpu.tar.gz"
          cp src/LICENSE src/build/bin/
          mkdir -p dist
          (cd src/build/bin && tar -czf "${GITHUB_WORKSPACE}/dist/${ASSET}" .)
          ls -la dist

      - name: Upload bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: app-${{ inputs.tag }}-linux-${{ matrix.arch }}-cpu
          path: dist/app-${{ inputs.tag }}-linux-${{ matrix.arch }}-cpu.tar.gz
          if-no-files-found: error
          # A rerun of this job (e.g. after a Vulkan failure) re-uploads; artifacts persist across attempts.
          overwrite: true

      - name: Evict stale ccache files
        # !cancelled(), unlike the save below: on a timeout the job gets a
        # single ~5 minute teardown window (measured ~4m50s after process
        # kill), shared by every remaining step and not replenished. Evicting
        # spends that window on housekeeping; the save is what actually needs
        # it, and a 2 GB cache is not quick to write.
        if: ${{ !cancelled() && env.CCACHE_LAUNCHER != '' }}
        continue-on-error: true
        run: ccache --evict-older-than 7d

      - name: Save ccache
        # Save even when the build failed: the objects compiled before the
        # failure are still worth keeping, and a job that saves nothing leaves
        # a hole in the cache lineage that widens the next run's tag gap.
        # Measured: gap 7 -> 68% hit rate, gap 13 -> 6%.
        #
        # always(), not !cancelled(): a timeout-minutes expiry puts the job on
        # the CANCELLATION path, not the failure path, so !cancelled() would
        # skip the save on the single most expensive case -- a leg that
        # compiled for hours and then hit the cap.
        # Skipped when Configure ccache turned the cache off: nothing compiled through it, so the
        # save would only re-upload the restored entry under a new key.
        if: ${{ always() && env.CCACHE_LAUNCHER != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-cpu-linux-${{ matrix.arch }}-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Vulkan on the same runner (same image; arm64 clang still set from the CPU half). Fresh tree
      # and cache at the same paths, so neither bundle changes.
      - name: Fresh source and ccache for the Vulkan build
        id: vulkan
        shell: bash
        run: |
          set -eux
          rm -rf "${GITHUB_WORKSPACE:?}/src" "${GITHUB_WORKSPACE:?}/dist" "${GITHUB_WORKSPACE:?}/.ccache"
          mkdir -p src
          tar -xzf "srcpkg/llama.cpp-source-${{ inputs.tag }}.tar.gz" -C src --strip-components=1

      - name: Install Vulkan SDK + build dependencies
        run: |
          set -eux
          if [ "${{ matrix.arch }}" = x64 ]; then
            wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
            sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
            sudo apt-get update -y
            sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev ninja-build
          else
            sudo apt-get update -y
            sudo apt-get install -y build-essential libvulkan-dev spirv-headers libssl-dev ninja-build
          fi

      - name: ccache (Vulkan)
        # Best-effort; see the verification in Configure ccache below.
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: vulkan-linux-${{ matrix.arch }}-${{ inputs.tag }}
          restore-keys: |
            vulkan-linux-${{ matrix.arch }}
          append-timestamp: false
          variant: ccache
          # ccache 4.13 from the action's binary; apt on ubuntu-22.04 ships 4.5.1.
          install: binary
          max-size: 2G
          save: false

      - name: Configure ccache (Vulkan)
        # The install step above is best-effort: on 09-18 its binary download returned 92 bytes
        # instead of a tarball and two healthy legs died on "tar: This does not look like a tar
        # archive". A cache accelerator must never fail a release build. So verify ccache
        # POSITIVELY here and, when it is missing or older than the options below require,
        # export an empty CCACHE_LAUNCHER so cmake builds this leg uncached instead of failing.
        # No apt fallback on purpose: ubuntu-22.04 ships 4.5.1, which rejects these options and
        # would quietly change cache semantics rather than announce itself.
        run: |
          set -uo pipefail
          need=4.10
          have="$(ccache --version 2>/dev/null | head -1 | awk '{print $3}')"
          if [ -n "$have" ] && [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ]; then
            ccache --set-config=compiler_check=content
            ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,pch_defines,locale
            ccache --set-config=compression_level=6
            echo "CCACHE_LAUNCHER=ccache" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::warning::ccache unusable (found '${have:-none}', need >= $need); building without a cache"
          echo "- ccache unusable (found \`${have:-none}\`); this leg built without a cache" >> "$GITHUB_STEP_SUMMARY"
          echo "CCACHE_LAUNCHER=" >> "$GITHUB_ENV"

      # Ubuntu 22.04 has an arm64 Vulkan loader, but its headers are too old for
      # the current backend and it has no glslc package. Install matching pinned
      # headers and build the shader compiler shipped with the LunarG SDK.
      - name: Install Vulkan headers (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -eux
          package="$RUNNER_TEMP/vulkan-headers.deb"
          staging="$RUNNER_TEMP/vulkan-headers"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            "https://packages.lunarg.com/vulkan/pool/main/v/vulkan-headers/vulkan-headers_1.4.313.0~rc1-1lunarg22.04-1_all.deb" \
            -o "$package"
          echo "587b2d8e79416b394170ab61557c98765570cd153730f819a917866d78f45e1a  $package" | sha256sum -c -
          dpkg-deb -x "$package" "$staging"
          sudo cp -a "$staging/usr/." /usr/local/

      - name: Build glslc (arm64) (Vulkan)
        if: matrix.arch == 'arm64'
        run: |
          set -eux
          archive="$RUNNER_TEMP/shaderc.tar.gz"
          source="$RUNNER_TEMP/shaderc"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
            "https://packages.lunarg.com/vulkan/pool/main/s/shaderc/shaderc_2025.2~rc1-1lunarg22.04.orig.tar.gz" \
            -o "$archive"
          echo "59c0c478f2f40a076e610587d099e39ed059cb7319fe464f8ba1bd07c6bf02c5  $archive" | sha256sum -c -
          mkdir -p "$source"
          tar -xzf "$archive" -C "$source"
          # ENABLE_PCH=OFF: glslang builds a clang precompiled header, and ccache
          # hands the cached .pch back on the next run. Clang validates a PCH by
          # the mtime of every system header it saw, so the first run after the
          # runner image reinstalls linux-libc-dev fails with "has been modified
          # since the precompiled header was built" (run 34459747884). Without the
          # PCH every object is an ordinary ccache hit and the build is unchanged.
          cmake -S "$source" -B "$source/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSHADERC_SKIP_TESTS=ON \
            -DSHADERC_SKIP_EXAMPLES=ON \
            -DSHADERC_SKIP_COPYRIGHT_CHECK=ON \
            -DENABLE_PCH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }}
          cmake --build "$source/build" --target glslc_exe -j "$(nproc)"
          sudo install -m 0755 "$source/build/glslc/glslc" /usr/local/bin/glslc
          glslc --version

      - name: Configure (Vulkan)
        working-directory: src
        run: |
          set -eux
          # Build recipe mirrors llama-cpp-binaries' Vulkan wheel: the CPU recipe
          # (backend-DL + all CPU variants + RPC) plus GGML_VULKAN. RPATH=$ORIGIN
          # so the bundle's sibling .so files resolve from the binary's own dir.
          # LLAMA_FATAL_WARNINGS below is -Werror. The arm64 image compiles with
          # clang-19 against GCC 12's libstdc++, where std::stable_sort still
          # reaches the deprecated get_temporary_buffer; GCC buries that in a
          # system header, clang reports it at our instantiation. That failed
          # this leg on 08-27 over a deprecation in code we do not own, so that
          # one diagnostic is off. Every other warning stays fatal.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_RPC=ON \
            -DGGML_VULKAN=ON \
            -DLLAMA_FATAL_WARNINGS=ON \
            -DCMAKE_CXX_FLAGS=-Wno-deprecated-declarations \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }}

      - name: Build (Vulkan)
        working-directory: src
        run: |
          set -eux
          # Backend modules (CPU variants, Vulkan, RPC) build as ggml
          # dependencies, so every tool pulls them in.
          cmake --build build --config Release -j "$(nproc)"
          strip build/bin/llama-* || true

      - name: Bundle OpenMP runtime (arm64) (Vulkan)
        if: matrix.arch == 'arm64'
        run: cp /usr/lib/llvm-19/lib/libomp.so.5 src/build/bin/

      # DiffusionGemma binaries (example targets present only in #24423 mix
      # builds): best-effort, never fail the job. See the CUDA child for the
      # rationale. The bundle tars all of build/bin, so anything produced here
      # is shipped automatically.
      - name: Build DiffusionGemma binaries (best-effort; mix builds only) (Vulkan)
        working-directory: src
        run: |
          set -u
          if [ ! -d examples/diffusion-gemma-server ]; then
            echo "no DiffusionGemma sources in this tree; skipping"
            exit 0
          fi
          cmake -S . -B build -DLLAMA_BUILD_EXAMPLES=ON \
            || { echo "reconfigure for examples failed; skipping DiffusionGemma binaries"; exit 0; }
          if cmake --build build --config Release -j "$(nproc)" \
              --target llama-diffusion-gemma-visual-server llama-diffusion-cli; then
            strip build/bin/llama-diffusion-gemma-visual-server build/bin/llama-diffusion-cli || true
            echo "built DiffusionGemma binaries"
          else
            echo "warning: DiffusionGemma binaries failed to build; bundle will omit them"
          fi
          exit 0

      - name: Package bundle (tar.gz) (Vulkan)
        run: |
          set -eux
          ASSET="app-${{ inputs.tag }}-linux-${{ matrix.arch }}-vulkan.tar.gz"
          cp src/LICENSE src/build/bin/
          mkdir -p dist
          (cd src/build/bin && tar -czf "${GITHUB_WORKSPACE}/dist/${ASSET}" .)
          ls -la dist

      - name: Upload bundle artifact (Vulkan)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: app-${{ inputs.tag }}-linux-${{ matrix.arch }}-vulkan
          path: dist/app-${{ inputs.tag }}-linux-${{ matrix.arch }}-vulkan.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Evict stale ccache files (Vulkan)
        # !cancelled(), unlike the save below: on a timeout the job gets a
        # single ~5 minute teardown window (measured ~4m50s after process
        # kill), shared by every remaining step and not replenished. Evicting
        # spends that window on housekeeping; the save is what actually needs
        # it, and a 2 GB cache is not quick to write.
        if: ${{ !cancelled() && steps.vulkan.outcome == 'success' && env.CCACHE_LAUNCHER != '' }}
        continue-on-error: true
        run: ccache --evict-older-than 7d

      - name: Save ccache (Vulkan)
        # Save even when the build failed: the objects compiled before the
        # failure are still worth keeping, and a job that saves nothing leaves
        # a hole in the cache lineage that widens the next run's tag gap.
        # Measured: gap 7 -> 68% hit rate, gap 13 -> 6%.
        #
        # always(), not !cancelled(): a timeout-minutes expiry puts the job on
        # the CANCELLATION path, not the failure path, so !cancelled() would
        # skip the save on the single most expensive case -- a leg that
        # compiled for hours and then hit the cap.
        # Skipped when Configure ccache turned the cache off: nothing compiled through it, so the
        # save would only re-upload the restored entry under a new key.
        # Only once the Vulkan half has its own cache dir: otherwise this would save the CPU
        # half's cache under the Vulkan key.
        if: ${{ always() && steps.vulkan.outcome == 'success' && env.CCACHE_LAUNCHER != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-vulkan-linux-${{ matrix.arch }}-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}

  build-windows:
    name: windows/${{ matrix.arch }}
    # Single x64 runner for both arches: arm64 is cross-compiled with the clang
    # toolchain (vcvars amd64_arm64), exactly like ggml-org's release.yml
    # windows-cpu job. CUDA stays on MSVC (mandatory for nvcc on Windows), but
    # the CPU build uses clang/LLVM to match upstream's proven CPU recipe.
    runs-on: windows-2025-vs2026
    # Every Azure Trusted Signing secret in this workflow is read by this job
    # and no other. Naming an environment is what makes them gateable: without
    # it there is no place to hang a required reviewer, so anyone who can
    # dispatch the parent workflow can sign under our identity.
    #
    # Inert until protection rules exist. GitHub creates a referenced-but-absent
    # environment on first run with no rules and no branch policy, and
    # repository secrets keep resolving inside a job that names an environment,
    # so this line alone changes nothing about how a build runs. Same shape as
    # release-desktop.yml in unslothai/unsloth.
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   vcvars: x64,         omp_arch: x86_64,  cpu_variants: 'ON' }
          - { arch: arm64, vcvars: amd64_arm64, omp_arch: aarch64, cpu_variants: 'OFF' }
    defaults:
      run:
        shell: pwsh
    steps:
      # The parent's resolve job built the source tree (upstream base + any mix
      # PRs, with the build number/commit and Unsloth fingerprint baked
      # into cmake/build-info.cmake) and uploaded it as an artifact; extract it
      # instead of cloning -- no .git needed, the build number is already baked.
      - name: Download source @ ${{ inputs.tag }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: ${{ inputs.source_artifact }}
          path: srcpkg
      - name: Extract source
        shell: bash
        run: |
          set -eux
          mkdir -p src
          tar -xzf "srcpkg/llama.cpp-source-${{ inputs.tag }}.tar.gz" -C src --strip-components=1

      - name: ccache
        # Best-effort; see the verification in Configure ccache below.
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03  # v1.2.23
        with:
          key: cpu-windows-${{ matrix.arch }}-${{ inputs.tag }}
          restore-keys: |
            cpu-windows-${{ matrix.arch }}
          append-timestamp: false
          variant: ccache
          # Force the action's ccache 4.13 binary. Its default (`detect`) skips the install when any
          # ccache is already on PATH, and windows-2025 images ship Strawberry Perl's 4.9.1, which
          # Configure ccache below rejects (< 4.10), so those legs built uncached every run.
          install: binary
          max-size: 2G
          save: false

      - name: Configure ccache
        # The install step above is best-effort: on 09-18 its binary download returned 92 bytes
        # instead of a tarball and two healthy legs died on "tar: This does not look like a tar
        # archive". A cache accelerator must never fail a release build. So verify ccache
        # POSITIVELY here and, when it is missing or older than the options below require,
        # export an empty CCACHE_LAUNCHER so cmake builds this leg uncached instead of failing.
        # No apt fallback on purpose: ubuntu-22.04 ships 4.5.1, which rejects these options and
        # would quietly change cache semantics rather than announce itself.
        run: |
          $ErrorActionPreference = 'Continue'
          $have = ((& ccache --version 2>$null | Select-Object -First 1) -split '\s+')[2]
          $ok = $false
          if ($have) { try { $ok = [version]($have -replace '[^0-9.].*$','') -ge [version]'4.10' } catch { $ok = $false } }
          if ($ok) {
            ccache --set-config=compiler_check=content
            ccache --set-config=sloppiness=include_file_mtime,include_file_ctime,pch_defines,locale
            ccache --set-config=compression_level=6
            "CCACHE_LAUNCHER=ccache" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Output "::warning::ccache unusable (found '$have', need >= 4.10); building without a cache"
            "- ccache unusable (found ``$have``); this leg built without a cache" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "CCACHE_LAUNCHER=" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          }

      - name: Install Ninja
        run: choco install ninja --no-progress

      # Build recipe copied from ggml-org/llama.cpp release.yml (windows-cpu):
      # clang via the per-arch LLVM toolchain file, "Ninja Multi-Config", OpenMP,
      # BoringSSL, and GGML_CPU_ALL_VARIANTS only on x64 (it is an x86 microarch
      # fan-out). vcvarsall sets the env (incl. the amd64_arm64 cross toolchain),
      # so this runs in cmd. CMAKE_ARGS mirrors upstream's env.CMAKE_ARGS and
      # builds the full tool + server set (no --target), matching the macOS bins.
      - name: Build
        working-directory: src
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }}
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/${{ matrix.arch }}-windows-llvm.cmake ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DBORINGSSL_GIT=https://github.com/google/boringssl.git ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=${{ matrix.cpu_variants }} ^
            -DGGML_OPENMP=ON ^
            -DGGML_RPC=ON ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DLLAMA_BUILD_TOOLS=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }} ^
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.CCACHE_LAUNCHER }}
          if errorlevel 1 exit /b 1
          cmake --build build --config Release
          if errorlevel 1 exit /b 1

      # DiffusionGemma binaries (#24423 mix builds only): best-effort, never fail
      # the job (trailing `exit /b 0`). vcvarsall is re-called -- step env does
      # not persist -- and the reconfigure reuses the cached clang toolchain.
      - name: Build DiffusionGemma binaries (best-effort; mix builds only)
        working-directory: src
        shell: cmd
        run: |
          if not exist examples\diffusion-gemma-server (
            echo no DiffusionGemma sources in this tree; skipping
            exit /b 0
          )
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ matrix.vcvars }}
          cmake -S . -B build -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build build --config Release --target llama-diffusion-gemma-visual-server llama-diffusion-cli
          exit /b 0

      # Ninja Multi-Config emits to build/bin/Release. Ship the OpenMP runtime
      # (GGML_OPENMP=ON) from the VS LLVM redist -- exactly as upstream does --
      # globbing the MSVC version dir so an image bump does not break the path.
      # Sort newest-first: older toolsets' libomp lacks entry points current
      # clang imports (__kmpc_dispatch_deinit -> STATUS_ENTRYPOINT_NOT_FOUND).
      # The build legs extract a source tarball rather than checking this repo
      # out, so the signing action and its scripts are not on disk. Fetch just
      # .github into a subdirectory: a checkout at the workspace root would
      # clean the extracted source tree out from under the build.
      - name: Fetch signing tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          path: signing-tooling
          sparse-checkout: .github
          persist-credentials: false

      # Authenticode-sign before packaging. The Studio installer downloads these
      # zips after its own signed installer has run, so nothing downstream signs
      # them. Smart App Control evaluates every binary as it loads and refuses
      # unknown unsigned code, naming whichever dependent DLL it blocked in a Bad
      # Image dialog (status 0xc0e90002), so the whole tree is signed, not just
      # the launcher executables.
      - name: Sign Windows binaries
        id: sign_windows
        uses: ./signing-tooling/.github/actions/sign-windows
        with:
          path: src/build/bin/Release
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-account: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          azure-certificate-profile: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}

      - name: Package bundle (zip)
        run: |
          $rel = "src/build/bin/Release"
          Copy-Item src/LICENSE $rel/
          $redist = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Redist\MSVC"
          $omp = Get-ChildItem "$redist\*\debug_nonredist\${{ matrix.arch }}\Microsoft.VC*.OpenMP.LLVM\libomp140.${{ matrix.omp_arch }}.dll" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Parent.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $omp) { Write-Error "libomp140.${{ matrix.omp_arch }}.dll not found in the VS LLVM redist"; exit 1 }
          Write-Host "shipping OpenMP runtime: $($omp.FullName)"
          Copy-Item $omp.FullName $rel/
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "app-${{ inputs.tag }}-windows-${{ matrix.arch }}-cpu.zip"
          Push-Location $rel
          7z a -tzip "$env:GITHUB_WORKSPACE/dist/$asset" .
          Pop-Location
          Get-ChildItem dist

      # Smoke the packaged x64 bundle: launching an exe loads ggml-base and the
      # picked libomp, so --version fails on a bad pick. timeout-minutes bounds
      # a loader hard-error that can block instead of exiting. arm64 is
      # cross-compiled and cannot run here.
      - name: Smoke test bundle (x64 only)
        if: matrix.arch == 'x64'
        timeout-minutes: 5
        run: |
          $rel = "src/build/bin/Release"
          & "$rel\llama-server.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Error "llama-server --version failed: $LASTEXITCODE"; exit 1 }

      # Verify the finished zip, not the build tree: packaging copies extra
      # runtimes in afterwards, and only the archive shows what actually ships.
      # Skipped on forks, which have no signing credentials and build unsigned.
      - name: Verify every binary in the bundle is signed
        if: ${{ steps.sign_windows.outputs.signed == 'true' }}
        shell: pwsh
        run: signing-tooling/.github/scripts/assert-windows-bundle-signed.ps1 -Path 'dist/app-${{ inputs.tag }}-windows-${{ matrix.arch }}-cpu.zip'

      - name: Upload bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: app-${{ inputs.tag }}-windows-${{ matrix.arch }}-cpu
          path: dist/app-${{ inputs.tag }}-windows-${{ matrix.arch }}-cpu.zip
          if-no-files-found: error

      - name: Evict stale ccache files
        # !cancelled(), unlike the save below: on a timeout the job gets a
        # single ~5 minute teardown window (measured ~4m50s after process
        # kill), shared by every remaining step and not replenished. Evicting
        # spends that window on housekeeping; the save is what actually needs
        # it, and a 2 GB cache is not quick to write.
        if: ${{ !cancelled() && env.CCACHE_LAUNCHER != '' }}
        continue-on-error: true
        run: ccache --evict-older-than 7d

      - name: Save ccache
        # Save even when the build failed: the objects compiled before the
        # failure are still worth keeping, and a job that saves nothing leaves
        # a hole in the cache lineage that widens the next run's tag gap.
        # Measured: gap 7 -> 68% hit rate, gap 13 -> 6%.
        #
        # always(), not !cancelled(): a timeout-minutes expiry puts the job on
        # the CANCELLATION path, not the failure path, so !cancelled() would
        # skip the save on the single most expensive case -- a leg that
        # compiled for hours and then hit the cap.
        # Skipped when Configure ccache turned the cache off: nothing compiled through it, so the
        # save would only re-upload the restored entry under a new key.
        if: ${{ always() && env.CCACHE_LAUNCHER != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-cpu-windows-${{ matrix.arch }}-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
